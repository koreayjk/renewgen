function AcadRanking() {
  const tabs = ["전체", "수학", "국어", "영어", "탐구"];
  const [tab, setTab] = useStateAcad(0);
  const { navigate } = useApp();

  const rows = useMemoAcad(() => {
    const filter = tabs[tab];
    let list = [...COURSES];
    if (filter !== "전체") {
      const subjId = SUBJECTS.find((s) => s.ko === filter)?.id;
      list = list.filter((c) => c.subject === subjId);
    }
    list = list.sort((a, b) => b.enrolled - a.enrolled).slice(0, 5);
    const trends = ["up", "up", "flat", "new", "up"];
    return list.map((c, i) => ({ ...c, rank: i + 1, trend: trends[i] }));
  }, [tab]);

  return (
    <div>
      <div className="acad-section-head">
        <div>
          <h2><em>실시간</em> 인기 강의</h2>
          <div className="sub">지금 가장 많이 수강 중인 TOP 5 — 한 시간 마다 갱신.</div>
        </div>
      </div>

      <div className="acad-rank">
        <div className="acad-rank-tabs">
          {tabs.map((t, i) => (
            <button key={t} className={"acad-rank-tab" + (i === tab ? " active" : "")} onClick={() => setTab(i)}>
              {t}
            </button>
          ))}
        </div>

        {rows.length === 0 ? (
          <div style={{ padding: 40, textAlign: "center", color: "var(--acad-muted)", fontSize: 14 }}>
            해당 영역의 인기 강의 데이터를 준비 중입니다.
          </div>
        ) : (
          rows.map((c, i) => {
            const ins = findInstructor(c.instructor);
            return (
              <button key={c.id} className={"acad-rank-row" + (i < 3 ? " top" : "")} onClick={() => navigate("/courses/" + c.id)}>
                <div className="acad-rank-no">{c.rank.toString().padStart(2, "0")}</div>
                <div>
                  <div className="acad-rank-title">{c.title}</div>
                  <div className="acad-rank-meta">
                    <span>{ins?.name}</span><span className="dot" />
                    <span>{c.level}</span><span className="dot" />
                    <span>★ {c.rating} ({c.reviews.toLocaleString()})</span>
                  </div>
                </div>
                <div>
                  <span className={"acad-rank-trend " + c.trend}>
                    {c.trend === "up" ? "▲ HOT" : c.trend === "new" ? "NEW" : "—"}
                  </span>
                </div>
              </button>
            );
          })
        )}
      </div>
    </div>
  );
}

  { id: 10, name: "민재", initials: "민", msg: "f'(x) = 3x² - 3 이 부분 다시요!!", t: "20:12", role: "student" },
  { id: 11, name: "김지원 강사님", initials: "지", msg: "민재 학생, 지금 오른쪽 판서에 다시 표시했어요. 보이죠?", t: "20:13", role: "instructor" },
];

const INITIAL_QUESTIONS = [
  { id: 1, name: "수아", q: "극값 판정에서 부호 변화만 보면 되나요? 이계도함수는 안 써도 되는지 궁금합니다.", votes: 14, t: "5분 전", answered: false },
  { id: 2, name: "민재", q: "예제 1에서 분모가 0이 될 때는 어떻게 처리해야 하나요?", votes: 8, t: "8분 전", answered: true },
  { id: 3, name: "현우", q: "롤의 정리랑 평균값 정리 차이가 정확히 뭔가요?", votes: 5, t: "방금", answered: false },
  { id: 4, name: "은비", q: "오늘 첨삭 과제 마감 언제까지인지...?", votes: 3, t: "12분 전", answered: false },
];

const STUDENTS = [
  { name: "김지원 강사님", initials: "지", camera: true, mic: true, isInstructor: true },
  { name: "도윤", initials: "도", camera: false, mic: false, isMe: true },
  { name: "은비", initials: "은", camera: true, mic: false, raised: false },
  { name: "민재", initials: "민", camera: true, mic: false, raised: false },
  { name: "수아", initials: "수", camera: false, mic: false, raised: true },
  { name: "현우", initials: "현", camera: false, mic: false, raised: false },
  { name: "지유", initials: "지", camera: false, mic: false, raised: false },
  { name: "예린", initials: "예", camera: false, mic: false, raised: false },
  { name: "태우", initials: "태", camera: false, mic: false, raised: false },
  { name: "서연", initials: "서", camera: true, mic: false, raised: false },
];

// Simulated "live" chats that drip in over time
const DRIP_CHATS = [
  { name: "예린", initials: "예", msg: "선생님 화이트보드 빨간색 너무 잘 보여요 👍", role: "student" },
  { name: "태우", initials: "태", msg: "예제 3 풀이가 핵심인 것 같아요", role: "student" },
  { name: "김지원 강사님", initials: "지", msg: "맞아요, 예제 3은 필수예요. 노트해두세요.", role: "instructor" },
  { name: "서연", initials: "서", msg: "이거 시험에 나올까요?", role: "student" },
];

function LiveRoom({ course, onEnd }) {
  const { tweaks, navigate, showToast } = useApp();
  const ins = findInstructor(course.instructor);
  const layout = tweaks.liveLayout || "split";

  const [tab, setTab] = useStateLR("chat");
  const [chats, setChats] = useStateLR(INITIAL_CHATS);
  const [chatInput, setChatInput] = useStateLR("");
  const [questions, setQuestions] = useStateLR(INITIAL_QUESTIONS);
  const [voted, setVoted] = useStateLR({});
  const [mic, setMic] = useStateLR(false);
  const [cam, setCam] = useStateLR(false);
  const [handRaised, setHandRaised] = useStateLR(false);
  const [showAskModal, setShowAskModal] = useStateLR(false);
  const [askText, setAskText] = useStateLR("");
  const [elapsedS, setElapsedS] = useStateLR(13 * 60 + 47); // started 13:47 ago
  const chatScrollRef = useRefLR(null);

  // Elapsed timer
  useEffectLR(() => {
    const t = setInterval(() => setElapsedS((s) => s + 1), 1000);
    return () => clearInterval(t);
  }, []);

  // Drip in simulated chat
  useEffectLR(() => {
    let i = 0;
    const t = setInterval(() => {
      if (i >= DRIP_CHATS.length) { clearInterval(t); return; }
      const c = DRIP_CHATS[i++];
      const now = new Date();
      const t2 = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      setChats((prev) => [...prev, { id: Date.now() + i, ...c, t: t2 }]);
    }, 14000);
    return () => clearInterval(t);
  }, []);

  // Auto-scroll chat
  useEffectLR(() => {
    if (chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
  }, [chats]);

  const sendChat = () => {
    const text = chatInput.trim();
    if (!text) return;
    const now = new Date();
    const t = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    setChats((prev) => [...prev, { id: Date.now(), name: "도윤", initials: "도", msg: text, t, role: "me" }]);
    setChatInput("");
  };

  const vote = (id) => {
    if (voted[id]) return;
    setVoted((v) => ({ ...v, [id]: true }));
    setQuestions((qs) => qs.map((q) => q.id === id ? { ...q, votes: q.votes + 1 } : q));
  };

  const submitQuestion = () => {
    const text = askText.trim();
    if (!text) return;
    setQuestions((qs) => [...qs, { id: Date.now(), name: "도윤", q: text, votes: 1, t: "방금", answered: false }]);
    setVoted((v) => ({ ...v, [Date.now()]: true }));
    setAskText("");
    setShowAskModal(false);
    setTab("qa");
    showToast("질문이 등록되었습니다");
  };

  const fmt = (s) => {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`
      : `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  };

  const sidePanel = (
    <div className="lr-side">
      <div className="lr-tabs">
        <button className={"lr-tab" + (tab === "chat" ? " active" : "")} onClick={() => setTab("chat")}>
          채팅 <span className="lr-tab-count">{chats.length}</span>
        </button>
        <button className={"lr-tab" + (tab === "qa" ? " active" : "")} onClick={() => setTab("qa")}>
          질문 <span className="lr-tab-count">{questions.filter((q) => !q.answered).length}</span>
        </button>
        <button className={"lr-tab" + (tab === "students" ? " active" : "")} onClick={() => setTab("students")}>
          학생 <span className="lr-tab-count">192</span>
        </button>
      </div>
      <div className="lr-panel">
        {tab === "chat"     && <ChatPanel chats={chats} chatInput={chatInput} setChatInput={setChatInput} sendChat={sendChat} scrollRef={chatScrollRef} />}
        {tab === "qa"       && <QAPanel questions={questions} voted={voted} vote={vote} onAsk={() => setShowAskModal(true)} />}
        {tab === "students" && <StudentsPanel />}
      </div>
    </div>
  );

  const stackedPanels = (
    <div className="lr-side">
      <div className="lr-stacked-panels">
        <div>
          <div className="lr-tabs"><div className="lr-tab active" style={{ pointerEvents: "none" }}>채팅 <span className="lr-tab-count">{chats.length}</span></div></div>
          <ChatPanel chats={chats} chatInput={chatInput} setChatInput={setChatInput} sendChat={sendChat} scrollRef={chatScrollRef} />
        </div>
        <div>
          <div className="lr-tabs"><div className="lr-tab active" style={{ pointerEvents: "none" }}>질문 <span className="lr-tab-count">{questions.filter((q) => !q.answered).length}</span></div></div>
          <QAPanel questions={questions} voted={voted} vote={vote} onAsk={() => setShowAskModal(true)} />
        </div>
      </div>
    </div>
  );

  return (
    <div className="liveroom page-enter">
      {/* Top bar */}
      <div className="lr-top">
        <div className="lr-top-title">
          <span className="lr-live-pill">LIVE</span>
          <span className="lr-title">{course.title}</span>
          <span className="lr-sub">{ins?.name} · {course.level}</span>
        </div>
        <div className="lr-top-meta">
          <span>경과 <b>{fmt(elapsedS)}</b></span>
          <span style={{ width: 1, height: 16, background: "rgba(255,255,255,0.18)" }} />
          <span>접속 <b>192</b>명</span>
          <span style={{ width: 1, height: 16, background: "rgba(255,255,255,0.18)" }} />
          <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#2ECC71" }} />
            <span style={{ color: "rgba(255,255,255,0.7)", fontSize: 12 }}>녹화 중</span>
          </span>
        </div>
        <button className="lr-leave" onClick={onEnd}>
          <Icon name="close" size={14} /> 나가기
        </button>
      </div>

      {/* Main area */}
      <div className="lr-main" data-layout={layout}>
        {/* Stage */}
        <div className="lr-stage">
          <div className="lr-stage-inner">
            <Whiteboard />
            <InstructorCam ins={ins} micOn={true} />
          </div>

          {/* Tool dock */}
          <div className="lr-dock">
            <button className={"lr-tool" + (mic ? " active" : " off")} onClick={() => setMic((m) => !m)}>
              <Icon name="mic" size={18} />
              <span>{mic ? "마이크 켜짐" : "음소거"}</span>
            </button>
            <button className={"lr-tool" + (cam ? " active" : " off")} onClick={() => setCam((c) => !c)}>
              <Icon name="eye" size={18} />
              <span>{cam ? "카메라 ON" : "카메라 OFF"}</span>
            </button>
            <button className={"lr-tool" + (handRaised ? " active" : "")} onClick={() => { setHandRaised((h) => !h); showToast(handRaised ? "손을 내렸습니다" : "손을 들었습니다 — 강사님께 알림 전송"); }}>
              <HandIcon />
              <span>손들기</span>
            </button>
            <div className="lr-tool-sep" />
            <button className="lr-tool" onClick={() => setShowAskModal(true)}>
              <Icon name="chat" size={18} />
              <span>질문 작성</span>
            </button>
            <button className="lr-tool" onClick={() => showToast("자료 PDF가 새 탭에서 열렸습니다")}>
              <Icon name="pdf" size={18} />
              <span>강의 자료</span>
            </button>
            <button className="lr-tool" onClick={() => showToast("화면 캡처가 노트에 저장되었습니다")}>
              <Icon name="bookmark" size={18} />
              <span>판서 캡처</span>
            </button>
          </div>
        </div>

        {layout === "split" ? sidePanel : stackedPanels}
      </div>

      {/* Ask modal */}
      {showAskModal && (
        <div className="modal-backdrop" onClick={() => setShowAskModal(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 540 }}>
            <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 6, letterSpacing: "-0.025em" }}>강사님께 질문하기</div>
            <div style={{ fontSize: 13, color: "var(--acad-muted)", marginBottom: 16 }}>
              질문은 [질문] 탭에 등록되고, 다른 학생들의 추천을 받으면 우선으로 답변됩니다.
            </div>
            <textarea
              value={askText}
              onChange={(e) => setAskText(e.target.value)}
              placeholder="예) 극값을 판정할 때 이계도함수도 같이 봐야 하나요?"
              style={{
                width: "100%", minHeight: 120,
                background: "#fff",
                border: "1.5px solid var(--acad-line)",
                borderRadius: 6,
                padding: 12, fontSize: 14, lineHeight: 1.5,
                outline: "none", resize: "vertical",
                fontFamily: "inherit",
              }}
            />
            <div style={{ display: "flex", gap: 8, marginTop: 16, justifyContent: "flex-end" }}>
              <button className="btn btn-ghost" onClick={() => setShowAskModal(false)}>취소</button>
              <button className="btn btn-primary" onClick={submitQuestion}>질문 등록</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Whiteboard ─────────────────────────────────────────────────────
function Whiteboard() {
  return (
    <div style={{ position: "absolute", inset: 0 }}>
      <div className="lr-board" />
      <div className="lr-board-title">
        <span className="lr-tag">LESSON 03</span>
        <span>도함수의 활용 — <em>극값과 부호의 변화</em></span>
        <small>2026.05.21 (목) 20:00 · 라이브</small>
      </div>
      <div className="lr-board-content">
        <div className="lr-eq">
          <em>f</em>(<em>x</em>) = <em>x</em>³ − 3<em>x</em> + 2
        </div>
        <div className="lr-eq">
          <em>f</em>′(<em>x</em>) = 3<em>x</em>² − 3 = <span className="red">3(<em>x</em> − 1)(<em>x</em> + 1)</span>
          <span className="lr-arrow">← 인수분해 핵심</span>
        </div>
        <div className="lr-eq" style={{ marginTop: 4 }}>
          <span className="marker">극값 후보:</span> <em>x</em> = <span className="blue">±1</span>
        </div>

        <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 36, fontFamily: "Iowan Old Style, serif", fontSize: 22 }}>
          {/* sign chart */}
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "60px 36px 60px 36px 60px", textAlign: "center", color: "var(--acad-ink)" }}>
              <span style={{ color: "var(--acad-muted)" }}>−∞</span>
              <span style={{ fontWeight: 700, color: "var(--acad-navy)" }}>−1</span>
              <span style={{ color: "var(--acad-muted)" }}>—</span>
              <span style={{ fontWeight: 700, color: "var(--acad-navy)" }}>+1</span>
              <span style={{ color: "var(--acad-muted)" }}>+∞</span>
            </div>
            <div style={{ height: 2, background: "var(--acad-ink)", margin: "8px 0", position: "relative" }}>
              <span style={{ position: "absolute", top: -5, left: "21%", width: 8, height: 8, background: "var(--acad-red)", borderRadius: "50%" }} />
              <span style={{ position: "absolute", top: -5, left: "60%", width: 8, height: 8, background: "var(--acad-red)", borderRadius: "50%" }} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "60px 36px 60px 36px 60px", textAlign: "center" }}>
              <span style={{ color: "var(--acad-red)", fontWeight: 700 }}>+</span>
              <span />
              <span style={{ color: "var(--acad-navy)", fontWeight: 700 }}>−</span>
              <span />
              <span style={{ color: "var(--acad-red)", fontWeight: 700 }}>+</span>
            </div>
          </div>
          {/* arrows */}
          <div style={{ fontSize: 14, color: "var(--acad-muted)", fontFamily: "var(--font-kr)", fontWeight: 600, lineHeight: 1.7 }}>
            <div><span style={{ color: "var(--acad-red)", fontWeight: 800 }}>x = −1</span> → 극댓값 <b>4</b></div>
            <div><span style={{ color: "var(--acad-navy)", fontWeight: 800 }}>x = +1</span> → 극솟값 <b>0</b></div>
          </div>
        </div>

        <div className="lr-note" style={{ marginTop: 14 }}>부호 변화를 반드시 확인! 이계도함수는 ‘판정 도구’일 뿐.</div>
      </div>
    </div>
  );
}

function InstructorCam({ ins, micOn }) {
  return (
    <div className="lr-cam">
      <div className="lr-cam-face">{ins?.initials || "강사"}</div>
      <span className="lr-cam-label">강사 · {ins?.name}</span>
      {micOn && (
        <span className="lr-cam-mic">
          <Icon name="mic" size={11} />
        </span>
      )}
    </div>
  );
}

const HandIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M8 11V5a1.5 1.5 0 0 1 3 0v6" />
    <path d="M11 11V4a1.5 1.5 0 0 1 3 0v7" />
    <path d="M14 11V5a1.5 1.5 0 0 1 3 0v8" />
    <path d="M17 11a1.5 1.5 0 0 1 3 0v4a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-2a1.5 1.5 0 0 1 3 0" />
  </svg>
);

// ── Chat panel ─────────────────────────────────────────────────────
function ChatPanel({ chats, chatInput, setChatInput, sendChat, scrollRef }) {
  return (
    <>
      <div className="lr-chat-list" ref={scrollRef}>
        {chats.map((c) => (
          <div key={c.id} className={"lr-chat-msg " + c.role}>
            <span className="lr-chat-avatar">{c.initials}</span>
            <div className="lr-chat-body">
              <div className="lr-chat-name">
                <strong>{c.name}</strong>
                <span>{c.t}</span>
              </div>
              <div className="lr-chat-text">{c.msg}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="lr-chat-input-bar">
        <input
          className="lr-chat-input"
          value={chatInput}
          onChange={(e) => setChatInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") sendChat(); }}
          placeholder="메시지 보내기…"
        />
        <button className="lr-chat-send" onClick={sendChat}>전송</button>
      </div>
    </>
  );
}

// ── Q&A panel ──────────────────────────────────────────────────────
function QAPanel({ questions, voted, vote, onAsk }) {
  const sorted = [...questions].sort((a, b) => Number(a.answered) - Number(b.answered) || b.votes - a.votes);
  return (
    <>
      <div className="lr-qa-list">
        {sorted.map((q) => (
          <div key={q.id} className={"lr-q" + (q.answered ? " answered" : "")}>
            <div className={"lr-q-vote" + (voted[q.id] ? " voted" : "")}>
              <button onClick={() => vote(q.id)} aria-label="추천">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l8 10h-5v6h-6v-6H4z" /></svg>
              </button>
              <span className="lr-q-vote-num">{q.votes}</span>
            </div>
            <div className="lr-q-body">
              <div className="lr-q-meta">
                <strong>{q.name}</strong>
                <span>· {q.t}</span>
              </div>
              <div className="lr-q-text">{q.q}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="lr-q-ask">
        <button onClick={onAsk}>＋ 새 질문 작성</button>
      </div>
    </>
  );
}

// ── Students roster ────────────────────────────────────────────────
function StudentsPanel() {
  const raised = STUDENTS.filter((s) => s.raised);
  const others = STUDENTS.filter((s) => !s.raised);
  return (
    <div className="lr-students">
      {raised.length > 0 && (
        <>
          <div className="lr-students-head">손 든 학생 · {raised.length}</div>
          {raised.map((s, i) => <StudentRow key={"r" + i} s={s} />)}
        </>
      )}
      <div className="lr-students-head" style={{ marginTop: 12 }}>접속 중 · 192명 (10명 표시)</div>
      {others.map((s, i) => <StudentRow key={"o" + i} s={s} />)}
    </div>
  );
}

function StudentRow({ s }) {
  return (
    <div className={"lr-student" + (s.isMe ? " me" : "")}>
      <span className={"av" + (s.camera ? " cam-on" : "")}>{s.initials}</span>
      <div className="name">
        {s.name}
        {s.isInstructor && <small>· 강사</small>}
        {s.isMe && <small>· 나</small>}
      </div>
      <div className="icons">
        {s.raised && <span className="raised" title="손들기"><HandIcon /></span>}
        {s.mic && <Icon name="mic" size={13} />}
        {!s.camera && !s.isInstructor && <Icon name="eye" size={13} style={{ opacity: 0.4 }} />}
      </div>
    </div>
  );
}

window.LiveRoom = LiveRoom;

  </script>

  <script type="text/babel" data-from="app/pages-courses.jsx">
/* global React, COURSES, INSTRUCTORS, SUBJECTS, REVIEWS, useApp, Icon, CoursePoster, CourseRowCard, SectionHead, findInstructor, findCourse, findSubject, formatKRW, ACCOUNT */

const { useState: useStateC, useMemo: useMemoC } = React;

// ──────────────────────────────────────────────────────────────────
// /courses — list with filters
// ──────────────────────────────────────────────────────────────────
function CoursesPage() {
  const { navigate } = useApp();
  const [subject, setSubject] = useStateC("all");
  const [level, setLevel] = useStateC("all");
  const [view, setView] = useStateC("grid"); // grid | list
  const [sort, setSort] = useStateC("popular");
  const [query, setQuery] = useStateC("");

  const filtered = useMemoC(() => {
    let xs = COURSES.slice();
    if (subject !== "all") xs = xs.filter((c) => c.subject === subject);
    if (level !== "all") xs = xs.filter((c) => c.level.includes(level));
    if (query) xs = xs.filter((c) => (c.title + c.subtitle).toLowerCase().includes(query.toLowerCase()));
    if (sort === "popular") xs.sort((a, b) => b.enrolled - a.enrolled);
    if (sort === "newest")  xs.sort((a, b) => a.no.localeCompare(b.no));
    if (sort === "rating")  xs.sort((a, b) => b.rating - a.rating);
    if (sort === "priceAsc")  xs.sort((a, b) => a.salePrice - b.salePrice);
    return xs;
  }, [subject, level, query, sort]);

  const levels = ["all", "중A", "중B", "고A", "고B", "고C", "입문", "중급", "실전"];
  const subjectFilters = [
    { id: "all", ko: "전과목" },
    { id: "korean", ko: "국어" },
    { id: "math", ko: "수학" },
    { id: "english", ko: "영어" },
    { id: "social", ko: "사회" },
    { id: "science", ko: "과학" },
    { id: "toefl", ko: "토플" },
    { id: "toeic", ko: "토익" },
  ];

  return (
    <div className="page-enter">
      {/* Header band */}
      <section style={{ borderBottom: "1px solid var(--rj-faint)" }}>
        <div className="container-wide" style={{ paddingTop: 48, paddingBottom: 36 }}>
          <div className="eyebrow" style={{ color: "var(--rj-muted)" }}>All Courses · 전체 강의</div>
          <h1 style={{ fontFamily: "var(--font-kr-serif)", fontWeight: 500, fontSize: 64, letterSpacing: "-0.03em", margin: "16px 0 0", lineHeight: 1 }}>

          <p className="body-lg" style={{ color: "var(--rj-muted)", marginTop: 18, maxWidth: 640 }}>
            실시간 라이브 + 다시보기 + 첨삭 — 모든 강의가 같은 구성으로 짜여 있습니다.
          </p>
        </div>
      </section>

      {/* Filters bar */}
      <section className="container-wide" style={{ paddingTop: 28, paddingBottom: 28, position: "sticky", top: 72, background: "var(--rj-paper)", zIndex: 10, borderBottom: "1px solid var(--rj-faint)" }}>
        <div style={{ display: "grid", gridTemplateColumns: "auto 1fr auto auto", gap: 24, alignItems: "center" }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {subjectFilters.map((s) => (
              <FilterChip key={s.id} active={subject === s.id} onClick={() => setSubject(s.id)}>{s.ko}</FilterChip>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", flexWrap: "wrap" }}>
            {levels.map((lv) => (
              <FilterChip key={lv} active={level === lv} onClick={() => setLevel(lv)}>{lv === "all" ? "전체 레벨" : lv}</FilterChip>
            ))}
          </div>
          <div style={{ position: "relative" }}>
            <Icon name="search" size={16} className="" />
            <input className="input" style={{ width: 220, paddingLeft: 36 }} placeholder="강의 검색"
                   value={query} onChange={(e) => setQuery(e.target.value)} />
            <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", pointerEvents: "none", color: "var(--rj-muted)" }}><Icon name="search" size={16} /></span>
          </div>
          <select className="input" style={{ width: 140 }} value={sort} onChange={(e) => setSort(e.target.value)}>
            <option value="popular">인기순</option>
            <option value="newest">신규순</option>
            <option value="rating">평점순</option>
            <option value="priceAsc">가격낮은순</option>
          </select>
        </div>
      </section>

      {/* Result count + view toggle */}
      <section className="container-wide" style={{ paddingTop: 32 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
          <div style={{ fontSize: 14, color: "var(--rj-muted)" }}>
            <span className="num-en" style={{ color: "var(--rj-ink)", fontWeight: 600 }}>{filtered.length}</span>개의 강의
          </div>
          <div style={{ display: "flex", gap: 4, padding: 4, border: "1px solid var(--rj-line)", borderRadius: 999 }}>
            <button onClick={() => setView("grid")} className="btn btn-sm" style={{ background: view === "grid" ? "var(--rj-ink)" : "transparent", color: view === "grid" ? "var(--rj-paper)" : "var(--rj-ink)", height: 30 }}>그리드</button>
            <button onClick={() => setView("list")} className="btn btn-sm" style={{ background: view === "list" ? "var(--rj-ink)" : "transparent", color: view === "list" ? "var(--rj-paper)" : "var(--rj-ink)", height: 30 }}>리스트</button>
          </div>
        </div>

        {view === "grid" ? (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 20, paddingBottom: 80 }}>
            {filtered.map((c) => (
              <div key={c.id} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <CoursePoster course={c} onClick={() => navigate("/courses/" + c.id)} />
                <CourseMetaUnderPoster course={c} />
              </div>
            ))}
            {filtered.length === 0 && <div style={{ gridColumn: "1 / -1", textAlign: "center", padding: 80, color: "var(--rj-muted)" }}>해당하는 강의가 없습니다</div>}
          </div>
        ) : (
          <div style={{ display: "grid", gap: 16, paddingBottom: 80 }}>
            {filtered.map((c) => (
              <CourseRowCard key={c.id} course={c} onOpen={() => navigate("/courses/" + c.id)} />
            ))}
            {filtered.length === 0 && <div style={{ textAlign: "center", padding: 80, color: "var(--rj-muted)" }}>해당하는 강의가 없습니다</div>}
          </div>
        )}
      </section>
    </div>
  );
}

function FilterChip({ active, onClick, children }) {
  return (
    <button onClick={onClick} className="chip" style={{
      background: active ? "var(--rj-ink)" : "transparent",
      color: active ? "var(--rj-paper)" : "var(--rj-ink)",
      borderColor: active ? "var(--rj-ink)" : "var(--rj-faint)",
      height: 32,
      padding: "0 14px",
      cursor: "pointer",
    }}>{children}</button>
  );
}

function CourseMetaUnderPoster({ course }) {
  const ins = findInstructor(course.instructor);

}

function Curriculum({ course, owned, onPlay }) {

      <div className="section-head" style={{ marginBottom: 8 }}>
        <div>
          <div className="eyebrow" style={{ color: "var(--rj-muted)" }}>Syllabus · 16주 커리큘럼</div>

        </div>
      </div>

      <div style={{ border: "1px solid var(--rj-line)", borderRadius: "var(--rj-r)" }}>

            }}>
              <span className="num-en" style={{ fontSize: 12, letterSpacing: "0.14em", color: "var(--rj-muted)", fontWeight: 700 }}>{s.unit}</span>
              <span style={{ fontFamily: "var(--font-kr-serif)", fontSize: 19, letterSpacing: "-0.025em" }}>{s.title}</span>
              <span style={{ fontSize: 13, color: "var(--rj-muted)" }}>{s.lessons}강 · {s.duration}</span>
              <Icon name="chevronDown" size={18} className="" />
            </button>
            {open === i && (
              <div style={{ padding: "0 24px 20px 128px", display: "grid", gap: 10 }}>
                {Array.from({ length: s.lessons }, (_, j) => (
                  <div key={j} style={{ display: "flex", alignItems: "center", gap: 14, padding: "10px 0", borderTop: "1px solid var(--rj-faint)" }}>

                    <span style={{ flex: 1, fontSize: 14 }}>{j === 0 ? "라이브 — " : "다시보기 — "} {s.title} · 파트 {j + 1}</span>
                    <span style={{ fontSize: 12, color: "var(--rj-muted)", fontFamily: "var(--font-en)" }}>{j === 0 ? "LIVE" : "VOD"} · {28 + j * 4}m</span>
                    {(owned || (i === 0 && j === 0)) ? (
                      <button className="btn btn-sm btn-soft" onClick={onPlay}><Icon name="play" size={12} /> 재생</button>
                    ) : (
                      <Icon name="lock" size={14} className="" />
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

  <script data-from="image-slot.js">
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)
/* BEGIN USAGE */
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever you want the user to
 * supply an image. You control the slot's shape and size; the user fills it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —
 * same read-via-fetch / write-via-window.omelette pattern as
 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The host bridge only allows sidecar writes at the project root, so the
 * HTML that uses this component is assumed to live at the project root too
 * (same constraint as design_canvas.jsx).
 *
 * Attributes:
 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')
 *                'circle' applies 50% border-radius; on a non-square slot
 *                that's an ellipse — set equal width and height for a true
 *                circle.
 *   radius       Corner radius in px for 'rounded'.       (default 12)
 *   mask         Any CSS clip-path value. Overrides `shape` — use this for
 *                hexagons, blobs, arbitrary polygons.
 *   fit          object-fit: cover | contain | fill.       (default 'cover')
 *                With cover (the default) double-clicking the filled slot
 *                enters a reframe mode: the whole image spills past the mask
 *                (translucent outside, opaque inside), drag to reposition,
 *                corner-drag to scale. The crop persists alongside the image
 *                in the sidecar. contain/fill stay static.
 *   position     object-position for fit=contain|fill.     (default '50% 50%')
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. A user drop overrides
 *                it; clearing the drop reveals src again.
 *
 * Size and layout come from ordinary CSS on the element — width/height
 * inline or from a parent grid — so it composes with any layout.
 *
 * Usage:
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>

(() => {
  const STATE_FILE = '.image-slots.state.json';
  // 2× a ~600px slot in a 1920-wide deck — retina-sharp without making the
  // sidecar enormous. A 1200px WebP at q=0.85 is ~150-300KB.
  const MAX_DIM = 1200;

  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.

  // ── Shared sidecar store ────────────────────────────────────────────────
  // One fetch + immediate write-on-change for every <image-slot> on the
  // page. Reads via fetch() so viewing works anywhere the HTML and sidecar
  // are served together; writes go through window.omelette.writeFile, which
  // the host allowlists to *.state.json basenames only.
  const subs = new Set();

  // ids explicitly cleared before the sidecar fetch resolved — otherwise
  // the merge below can't tell "never set" from "just deleted" and would
  // resurrect the sidecar's stale value.
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // Merge: sidecar loses to any in-memory change that raced ahead of
        // the fetch (drop or clear) so neither is clobbered by hydration.
        if (j && typeof j === 'object') {
          const merged = Object.assign({}, j, slots);
          // A framing-only write that raced ahead of hydration must not
          // drop a user image that's only on disk — inherit u from the
          // sidecar for any in-memory entry that lacks one.
          for (const k in slots) {
            if (merged[k] && !merged[k].u && j[k]) {
              merged[k].u = typeof j[k] === 'string' ? j[k] : j[k].u;
            }
          }
          for (const id of tombstones) delete merged[id];
          slots = merged;

      .catch(() => {})
      .then(() => { loaded = true; subs.forEach((fn) => fn()); });

  }

  // Serialize writes so two near-simultaneous drops on different slots
  // can't reorder at the backend and leave the sidecar with only the
  // first. A save requested mid-flight just marks dirty and re-fires on
  // completion with the then-current slots.
  let saving = false;
  let saveDirty = false;
  function save() {
    if (saving) { saveDirty = true; return; }
    const w = window.omelette && window.omelette.writeFile;
    if (!w) return;
    saving = true;
    Promise.resolve(w(STATE_FILE, JSON.stringify(slots)))
      .catch(() => {})
      .then(() => { saving = false; if (saveDirty) { saveDirty = false; save(); } });

  // data-URL string; newer ones store {u, s, x, y}. Either shape is valid.

  function setSlot(id, val) {

    else { delete slots[id]; if (!loaded) tombstones.add(id); }
    subs.forEach((fn) => fn());

    // it. Gate on the initial read so we don't overwrite a sidecar we haven't
    // merged yet; the merge in load() keeps this change once the read lands.

  // Encode through a canvas so the sidecar carries resized bytes, not the
  // raw upload. Longest side is capped at 2× the slot's rendered width

  // for photos, so there's no need for per-image format picking.
  async function toDataUrl(file, targetW) {
    const bitmap = await createImageBitmap(file);
    try {
      const cap = Math.min(MAX_DIM, Math.max(1, Math.round(targetW * 2)) || MAX_DIM);
      const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/webp', 0.85);
    } finally {
      bitmap.close && bitmap.close();
    }
  }

  // ── Custom element ──────────────────────────────────────────────────────
  const stylesheet =
    ':host{display:inline-block;position:relative;vertical-align:top;' +
    '  font:13px/1.3 system-ui,-apple-system,sans-serif;color:rgba(0,0,0,.55);width:240px;height:160px}' +
    '.frame{position:absolute;inset:0;overflow:hidden;background:rgba(0,0,0,.04)}' +
    // .frame img (clipped) and .spill (unclipped ghost + handles) share the
    // same left/top/width/height in frame-%, computed by _applyView(), so the
    // inside-mask crop and the outside-mask spill stay pixel-aligned.
    '.frame img{position:absolute;max-width:none;transform:translate(-50%,-50%);' +
    '  -webkit-user-drag:none;user-select:none;touch-action:none}' +
    // Reframe mode (double-click): the full image spills past the mask. The
    // spill layer is sized to the IMAGE bounds so its corners are where the
    // resize handles belong. The ghost <img> inside is translucent; the real
    // clipped <img> underneath shows the opaque in-mask crop.
    '.spill{position:absolute;transform:translate(-50%,-50%);display:none;z-index:1;' +
    '  cursor:grab;touch-action:none}' +
    ':host([data-panning]) .spill{cursor:grabbing}' +
    '.spill .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.35;' +
    '  pointer-events:none;-webkit-user-drag:none;user-select:none;' +
    '  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.2)}' +
    '.spill .handle{position:absolute;width:12px;height:12px;border-radius:50%;' +
    '  background:#fff;box-shadow:0 0 0 1.5px #c96442,0 1px 3px rgba(0,0,0,.3);' +
    '  transform:translate(-50%,-50%)}' +
    '.spill .handle[data-c=nw]{left:0;top:0;cursor:nwse-resize}' +
    '.spill .handle[data-c=ne]{left:100%;top:0;cursor:nesw-resize}' +
    '.spill .handle[data-c=sw]{left:0;top:100%;cursor:nesw-resize}' +
    '.spill .handle[data-c=se]{left:100%;top:100%;cursor:nwse-resize}' +
    ':host([data-reframe]){z-index:10}' +
    ':host([data-reframe]) .spill{display:block}' +
    ':host([data-reframe]) .frame{box-shadow:0 0 0 2px #c96442}' +
    '.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +
    '  cursor:pointer;user-select:none}' +
    '.empty svg{opacity:.45}' +
    '.empty .cap{max-width:90%;font-weight:500;letter-spacing:.01em}' +
    '.empty .sub{font-size:11px}' +
    '.empty .sub u{text-underline-offset:2px;text-decoration-color:rgba(0,0,0,.25)}' +
    '.empty:hover .sub u{color:rgba(0,0,0,.75);text-decoration-color:currentColor}' +
    ':host([data-over]) .frame{outline:2px solid #c96442;outline-offset:-2px;' +
    '  background:rgba(201,100,66,.10)}' +
    '.ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed rgba(0,0,0,.25);' +
    '  transition:border-color .12s}' +
    ':host([data-over]) .ring{border-color:#c96442}' +
    ':host([data-filled]) .ring{display:none}' +
    // Controls sit BELOW the mask (top:100%), absolutely positioned so the
    // author-declared slot height is unaffected. The gap is padding, not a
    // top offset, so the hover target stays contiguous with the frame.
    '.ctl{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:8px;' +
    '  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2;' +
    '  white-space:nowrap}' +
    ':host([data-filled][data-editable]:hover) .ctl,:host([data-reframe]) .ctl' +
    '  {opacity:1;pointer-events:auto}' +
    '.ctl button{appearance:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;' +
    '  background:rgba(0,0,0,.65);color:#fff;font:11px/1 system-ui,-apple-system,sans-serif;' +
    '  backdrop-filter:blur(6px)}' +
    '.ctl button:hover{background:rgba(0,0,0,.8)}' +
    '.err{position:absolute;left:8px;bottom:8px;right:8px;color:#b3261e;font-size:11px;' +
    '  background:rgba(255,255,255,.85);padding:4px 6px;border-radius:5px;pointer-events:none}';

  const icon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

  class ImageSlot extends HTMLElement {

    }

    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      // .spill and .ctl sit OUTSIDE .frame so overflow:hidden + border-radius
      // on the frame (circle, pill, rounded) can't clip them.

        '<style>' + stylesheet + '</style>' +
        '<div class="frame" part="frame">' +
        '  <img part="image" alt="" draggable="false" style="display:none">' +
        '  <div class="empty" part="empty">' + icon +
        '    <div class="cap"></div>' +
        '    <div class="sub">or <u>browse files</u></div></div>' +
        '  <div class="ring" part="ring"></div>' +
        '</div>' +
        '<div class="spill">' +
        '  <img class="ghost" alt="" draggable="false">' +
        '  <div class="handle" data-c="nw"></div><div class="handle" data-c="ne"></div>' +
        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +
        '</div>' +
        '<div class="ctl"><button data-act="replace" title="Replace image">Replace</button>' +
        '  <button data-act="clear" title="Remove image">Remove</button></div>' +
        '<input type="file" accept="' + ACCEPT.join(',') + '" hidden>';

      this._ring = root.querySelector('.ring');

      this._cap = root.querySelector('.cap');
      this._sub = root.querySelector('.sub');
      this._spill = root.querySelector('.spill');
      this._ghost = root.querySelector('.ghost');
      this._err = null;
      this._input = root.querySelector('input');

      this._gen = 0;

      });

      // baseline is computed from real dimensions, not the 100%×100% fallback.
      this._img.addEventListener('load', () => this._applyView());

      // stay static.
      this.addEventListener('dblclick', (e) => {
        if (!this.hasAttribute('data-editable') || !this._reframes()) return;
        e.preventDefault();
        if (this.hasAttribute('data-reframe')) this._exitReframe(true);
        else this._enterReframe();
      });
      // Pan + resize both originate on the spill layer. A handle pointerdown
      // drives an aspect-locked resize anchored at the opposite corner; any
      // other pointerdown on the spill pans. Offsets are frame-% so a
      // reframed slot survives responsive resize / PPTX export.
      this._spill.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        e.stopPropagation();
        this._spill.setPointerCapture(e.pointerId);
        const rect = this.getBoundingClientRect();
        const fw = rect.width || 1, fh = rect.height || 1;
        const corner = e.target.getAttribute && e.target.getAttribute('data-c');
        let move;
        if (corner) {
          // Resize about the OPPOSITE corner. Viewport-px throughout (rect
          // fw/fh, not clientWidth) so the math survives a transform:scale()
          // ancestor — deck_stage renders slides scaled-to-fit.
          const iw = this._img.naturalWidth || 1, ih = this._img.naturalHeight || 1;
          const base = Math.max(fw / iw, fh / ih);
          const sx = corner.includes('e') ? 1 : -1;
          const sy = corner.includes('s') ? 1 : -1;
          const s0 = this._view.s;
          const w0 = iw * base * s0, h0 = ih * base * s0;
          const cx0 = (50 + this._view.x) / 100 * fw;
          const cy0 = (50 + this._view.y) / 100 * fh;
          const ox = cx0 - sx * w0 / 2, oy = cy0 - sy * h0 / 2;
          const diag0 = Math.hypot(w0, h0);
          const ux = sx * w0 / diag0, uy = sy * h0 / diag0;
          move = (ev) => {
            const proj = (ev.clientX - rect.left - ox) * ux +
                         (ev.clientY - rect.top - oy) * uy;
            const s = clampS(s0 * proj / diag0);
            const d = diag0 * s / s0;
            this._view.s = s;
            this._view.x = (ox + ux * d / 2) / fw * 100 - 50;
            this._view.y = (oy + uy * d / 2) / fh * 100 - 50;
            this._clampView();
            this._applyView();
          };
        } else {
          this.setAttribute('data-panning', '');
          const start = { px: e.clientX, py: e.clientY, x: this._view.x, y: this._view.y };
          move = (ev) => {
            this._view.x = start.x + (ev.clientX - start.px) / fw * 100;
            this._view.y = start.y + (ev.clientY - start.py) / fh * 100;
            this._clampView();
            this._applyView();
          };
        }
        const up = () => {
          try { this._spill.releasePointerCapture(e.pointerId); } catch {}
          this._spill.removeEventListener('pointermove', move);
          this._spill.removeEventListener('pointerup', up);
          this._spill.removeEventListener('pointercancel', up);
          this.removeAttribute('data-panning');
          this._dragUp = null;
        };

        // tear the capture + listeners down synchronously.
        this._dragUp = up;
        this._spill.addEventListener('pointermove', move);
        this._spill.addEventListener('pointerup', up);
        this._spill.addEventListener('pointercancel', up);

      // zooms toward the cursor (offset' = cursor·(1-k) + offset·k).
      this.addEventListener('wheel', (e) => {
        if (!this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        const r = this.getBoundingClientRect();
        const cx = (e.clientX - r.left) / r.width * 100 - 50;
        const cy = (e.clientY - r.top) / r.height * 100 - 50;
        const prev = this._view.s;
        const next = clampS(prev * Math.pow(1.0015, -e.deltaY));
        if (next === prev) return;
        const k = next / prev;
        this._view.s = next;
        this._view.x = cx * (1 - k) + this._view.x * k;
        this._view.y = cy * (1 - k) + this._view.y * k;
        this._clampView();
        this._applyView();
      }, { passive: false });
    }

    connectedCallback() {
      // Warn once per page — an id-less slot works for the session but
      // cannot persist, and two id-less slots would share nothing.
      if (!this.id && !ImageSlot._warned) {
        ImageSlot._warned = true;
        console.warn('<image-slot> without an id will not persist its dropped image.');
      }
      this.addEventListener('dragenter', this);
      this.addEventListener('dragover', this);
      this.addEventListener('dragleave', this);
      this.addEventListener('drop', this);
      subs.add(this._subFn);
      // width%/height% in _applyView encode the frame aspect at call time —
      // a host resize (responsive grid, pane divider) would stretch the
      // image until the next _render. Re-render on size change: _render()
      // re-seeds _view from stored before clamp/apply, so a shrink→grow
      // cycle round-trips instead of ratcheting x/y toward the narrower
      // frame's clamp range.
      this._ro = new ResizeObserver(() => this._render());
      this._ro.observe(this);
      load();
      this._render();
    }

    disconnectedCallback() {
      subs.delete(this._subFn);
      this.removeEventListener('dragenter', this);
      this.removeEventListener('dragover', this);
      this.removeEventListener('dragleave', this);
      this.removeEventListener('drop', this);
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      this._exitReframe(false);
    }

    _enterReframe() {
      if (this.hasAttribute('data-reframe')) return;
      this.setAttribute('data-reframe', '');
      this._applyView();
      // Close on click outside (the spill handler stopPropagation()s so
      // in-image drags don't reach this) and on Escape. Listeners are held
      // on the instance so _exitReframe / disconnectedCallback can detach
      // exactly what was attached.
      this._outside = (e) => {
        if (e.composedPath && e.composedPath().includes(this)) return;
        this._exitReframe(true);
      };
      this._esc = (e) => { if (e.key === 'Escape') this._exitReframe(true); };
      document.addEventListener('pointerdown', this._outside, true);
      document.addEventListener('keydown', this._esc, true);
    }

    _exitReframe(commit) {
      if (!this.hasAttribute('data-reframe')) return;
      if (this._dragUp) this._dragUp();
      this.removeAttribute('data-reframe');
      this.removeAttribute('data-panning');
      if (this._outside) document.removeEventListener('pointerdown', this._outside, true);
      if (this._esc) document.removeEventListener('keydown', this._esc, true);
      this._outside = this._esc = null;
      if (commit) this._commitView();
    }

    attributeChangedCallback() { if (this.shadowRoot) this._render(); }

    // handleEvent — one listener object for all four drag events keeps the
    // add/remove symmetric and the depth counter correct.
    handleEvent(e) {
      if (e.type === 'dragenter' || e.type === 'dragover') {
        // Without preventDefault the browser never fires 'drop'.
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (e.type === 'dragenter') this._depth++;
        this.setAttribute('data-over', '');
      } else if (e.type === 'dragleave') {
        // dragenter/leave fire for every descendant crossing — count depth
        // so hovering the icon inside the empty state doesn't flicker.
        if (--this._depth <= 0) { this._depth = 0; this.removeAttribute('data-over'); }
      } else if (e.type === 'drop') {
        e.preventDefault();
        e.stopPropagation();
        this._depth = 0;
        this.removeAttribute('data-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) this._ingest(f);
      }
    }

    async _ingest(file) {
      this._setError(null);
      if (!file || ACCEPT.indexOf(file.type) < 0) {
        this._setError('Drop a PNG, JPEG, WebP, or AVIF image.');
        return;
      }
      // toDataUrl can take hundreds of ms on a large photo. A Clear or a
      // newer drop during that window would be clobbered when this await
      // resumes — bump + capture a generation so stale encodes bail.
      const gen = ++this._gen;
      try {
        const w = this.clientWidth || this.offsetWidth || MAX_DIM;
        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;
        // Only exit reframe once the new image is in hand — a rejected type
        // or decode failure leaves the in-progress crop untouched.
        this._exitReframe(false);
        const val = { u: url, s: 1, x: 0, y: 0 };
        setSlot(this.id || '', val);
        // Keep a session-local copy for id-less slots so the drop still
        // shows, even though it cannot persist.
        if (!this.id) { this._local = val; this._render(); }
      } catch (err) {
        if (gen !== this._gen) return;
        this._setError('Could not read that image.');
        console.warn('<image-slot> ingest failed:', err);
      }
    }

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;
      const d = document.createElement('div');
      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    // Reframing (pan/resize) is only meaningful for fit=cover — contain/fill
    // keep the old object-fit path and double-click is a no-op.
    _reframes() {
      return this.hasAttribute('data-filled') &&
        (this.getAttribute('fit') || 'cover') === 'cover';
    }

    // Cover-baseline geometry, shared by clamp/apply/resize. Null until the
    // img has loaded (naturalWidth is 0 before that) or when the slot has no
    // layout box — ResizeObserver fires with a 0×0 rect under display:none,
    // and clamping against a degenerate 1×1 frame would silently pull the
    // stored pan toward zero.
    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      return { iw, ih, fw, fh, base: Math.max(fw / iw, fh / ih) };
    }

    _clampView() {
      // Pan range on each axis is half the overflow past the frame edge.
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        // Non-cover, or dimensions not known yet (before img load).
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = fit;
        this._img.style.objectPosition = this.getAttribute('position') || '50% 50%';
        return;
      }
      // Cover baseline: img fills the frame on its tighter axis at s=1, so
      // pan works immediately on the overflowing axis without zooming first.
      // Width/height and left/top are all frame-% — depends only on the
      // frame aspect ratio, so a responsive resize keeps the same crop. The
      // spill layer mirrors the same box so its corners = image corners.
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      this._spill.style.width = w; this._spill.style.height = h;
      this._spill.style.left = l; this._spill.style.top = t;
    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;
      // Framing-only (no u) persists too so an author-src slot remembers its
      // crop; clearing the sidecar still falls through to src=.
      if (this.id) setSlot(this.id, v);
      else { this._local = v; }
    }

    _render() {
      // Shape / mask. Presets use border-radius so the dashed ring can
      // follow the rounded outline; clip-path is only applied for an
      // explicit `mask` (the ring is hidden there since a rectangle
      // dashed border chopped by an arbitrary polygon looks broken).
      const mask = this.getAttribute('mask');
      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();
      let radius = '';
      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {
        const n = parseFloat(this.getAttribute('radius'));
        radius = (Number.isFinite(n) ? n : 12) + 'px';
      }
      this._frame.style.borderRadius = mask ? '' : radius;
      this._frame.style.clipPath = mask || '';
      this._ring.style.borderRadius = mask ? '' : radius;
      this._ring.style.display = mask ? 'none' : '';

      // Controls and reframe entry gate on this so share links stay read-only.
      const editable = !!(window.omelette && window.omelette.writeFile);
      this.toggleAttribute('data-editable', editable);
      this._sub.style.display = editable ? '' : 'none';

      // Content. The sidecar is also writable by the agent's write_file
      // tool, so its value isn't guaranteed canvas-originated — only accept
      // data:image/ URLs from it. The `src` attribute is author-controlled
      // (Claude wrote it into the HTML) so it passes through unchanged.
      let stored = this.id ? getSlot(this.id) : this._local;
      if (stored && stored.u && !/^data:image\//i.test(stored.u)) stored = null;
      const srcAttr = this.getAttribute('src') || '';
      this._userUrl = (stored && stored.u) || null;
      const url = this._userUrl || srcAttr;
      // Don't clobber an in-flight reframe with a store-triggered re-render.
      if (!this.hasAttribute('data-reframe')) {
        this._view = {
          s: stored && Number.isFinite(stored.s) ? clampS(stored.s) : 1,
          x: stored && Number.isFinite(stored.x) ? stored.x : 0,
          y: stored && Number.isFinite(stored.y) ? stored.y : 0,
        };
      }
      this._cap.textContent = this.getAttribute('placeholder') || 'Drop an image';
      // Toggle via style.display — the [hidden] attribute alone loses to
      // the display:flex / display:block rules in the stylesheet above.
      if (url) {
        if (this._img.getAttribute('src') !== url) {
          this._img.src = url;
          this._ghost.src = url;
        }
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        this._empty.style.display = 'flex';
        this.removeAttribute('data-filled');
      }
    }
  }

  if (!customElements.get('image-slot')) {
    customElements.define('image-slot', ImageSlot);
  }
})();

function MonthGrid({ year, month }) {
  const key = year + "-" + month;
  const events = CAL[key] || [];
  const first = new Date(year, month - 1, 1).getDay();
  const days = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  const evFor = (d) => events.filter((e) => (e.d === d) || (e.from <= d && d <= e.to));

  return (
    <div style={{ border: "1.5px solid " + NAVY, borderRadius: 14, overflow: "hidden", background: PAPER }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", background: NAVY }}>
        {["일", "월", "화", "수", "목", "금", "토"].map((w, i) => (
          <div key={w} style={{ padding: "11px 0", textAlign: "center", fontWeight: 800, fontSize: 12.5, color: i === 0 ? "#FF9B9B" : i === 6 ? "#9BC4FF" : "rgba(255,255,255,0.85)" }}>{w}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)" }}>
        {cells.map((d, idx) => {
          const dow = idx % 7;
          return (
            <div key={idx} style={{ minHeight: 104, borderTop: "1px solid " + LINE, borderLeft: dow === 0 ? "none" : "1px solid " + LINE, padding: "8px 7px", background: d ? "#fff" : "rgba(0,29,61,0.02)" }}>

                const st = EV_STYLE[e.type];
                const isStart = (e.d === d) || (e.from === d);
                return (
                  <div key={k} title={e.label} style={{ marginTop: 4, background: st.bg, color: st.fg, borderRadius: 4, padding: "3px 6px", fontSize: 10, fontWeight: 700, lineHeight: 1.3, minHeight: 18, overflow: "hidden" }}>
                    {isStart ? (
                      <span style={{ display: "block", whiteSpace: "normal" }}>
                        {e.label}{st.badge && <b style={{ marginLeft: 4, color: "#C8302B", fontSize: 9, letterSpacing: "0.04em" }}>{st.badge}</b>}
                      </span>
                    ) : "\u00A0"}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function QuarterSchedule() {
  const [quarter, setQuarter] = useStateCur("2분기");
  const months = Q_MONTHS[quarter].months;
  const firstRun = React.useRef(true);
  const [mIdx, setMIdx] = useStateCur(() => { const i = Q_MONTHS["2분기"].months.indexOf(6); return i < 0 ? 0 : i; });
  React.useEffect(() => { if (firstRun.current) { firstRun.current = false; return; } setMIdx(0); }, [quarter]);
  const month = months[Math.min(mIdx, months.length - 1)];

  const legend = [
    ["개강 · 종강", EV_STYLE.start.bg], ["월간평가", EV_STYLE.test.bg],
    ["성적 고지 · 정정", EV_STYLE.notice.bg], ["가정학습 · 행사", EV_STYLE.home.bg], ["공휴일", EV_STYLE.holiday.bg],
  ];

  return (
    <div style={{ display: "grid", gridTemplateColumns: "230px 1fr", gap: 24, alignItems: "start" }}>
      {/* left: quarter nav + legend */}
      <div style={{ display: "grid", gap: 10 }}>
        {Object.keys(Q_MONTHS).map((q) => {
          const active = quarter === q;
          return (
            <button key={q} onClick={() => setQuarter(q)} style={{
              textAlign: "left", padding: "16px 18px", borderRadius: 12, cursor: "pointer",

              <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, fontWeight: 700, opacity: 0.7 }}>

              </span>
              <div style={{ fontWeight: 900, fontSize: 19, letterSpacing: "-0.02em", marginTop: 4 }}>{q}</div>
              <div style={{ fontSize: 12.5, fontWeight: 600, marginTop: 4, color: active ? "rgba(255,255,255,0.7)" : MUTED, whiteSpace: "nowrap" }}>{Q_MONTHS[q].range}</div>
            </button>
          );
        })}
        <div style={{ marginTop: 8, background: PAPER, border: "1px solid " + LINE, borderRadius: 12, padding: "14px 16px", display: "grid", gap: 9 }}>
          <div style={{ fontWeight: 800, fontSize: 12, color: MUTED }}>범례</div>
          {legend.map(([t, c]) => (
            <div key={t} style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 12.5, fontWeight: 600, color: "var(--acad-ink)" }}>

            </div>

        </div>
      </div>

      {/* right: month nav + grid */}
      <div>
        <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 20, marginBottom: 18 }}>
          <button onClick={() => setMIdx((i) => Math.max(0, i - 1))} disabled={mIdx === 0} style={navBtn(mIdx === 0)}><Icon name="arrowLeft" size={18} /></button>
          <div style={{ fontWeight: 900, fontSize: 28, letterSpacing: "-0.03em", color: NAVY, minWidth: 180, textAlign: "center" }}>2026년 {month}월</div>
          <button onClick={() => setMIdx((i) => Math.min(months.length - 1, i + 1))} disabled={mIdx === months.length - 1} style={navBtn(mIdx === months.length - 1)}><Icon name="arrow" size={18} /></button>
        </div>
        <MonthGrid year={2026} month={month} />
        <p style={{ marginTop: 16, fontSize: 13, color: MUTED, fontWeight: 500 }}>

        </p>
      </div>
    </div>
  );
}
function navBtn(disabled) {
  return {

// ──────────────────────────────────────────────────────────────────
function SignupPage() {
  const { navigate, login, showToast } = useApp();
  const [step, setStep] = useStateA(1);
  const [data, setData] = useStateA({ email: "", password: "", name: "", grade: "고2", subject: "math", school: "", agree: { service: false, privacy: false, marketing: false } });
  const update = (k, v) => setData((d) => ({ ...d, [k]: v }));
  const allAgree = data.agree.service && data.agree.privacy;

  const next = () => {
    if (step === 1) {
      if (!data.email || !data.password || !allAgree) { showToast("필수 항목을 입력해주세요"); return; }
    }
    if (step === 2) {
      if (!data.name || !data.school) { showToast("이름과 학교를 입력해주세요"); return; }
    }
    setStep((s) => s + 1);
  };

  const finish = () => {
    login(data.email, data.name, data.name.slice(-2));
    navigate("/mypage");
  };

  return (
    <div className="page-enter container" style={{ paddingTop: 56, paddingBottom: 96, maxWidth: 560 }}>
      <button className="btn-link" onClick={() => navigate("/")} style={{ color: "var(--rj-muted)", fontSize: 13, textDecoration: "none" }}><Icon name="arrowLeft" size={14} /> 처음으로</button>

      {/* Steps */}
      <div style={{ display: "flex", gap: 4, marginTop: 36 }}>
        {[1, 2, 3].map((n) => (
          <div key={n} style={{ flex: 1, height: 3, background: step >= n ? "var(--rj-ink)" : "var(--rj-faint)", borderRadius: 2 }} />
        ))}
      </div>
      <div className="label-cap" style={{ color: "var(--rj-muted)", marginTop: 12 }}>
        STEP {step} / 3 — {["계정 만들기", "프로필 입력", "관심 과목"][step - 1]}
      </div>

      {/* Step 1 */}
      {step === 1 && (
        <div style={{ marginTop: 32, display: "grid", gap: 18 }}>
          <div className="field"><label>Email · 이메일</label><input className="input input-lg" type="email" value={data.email} onChange={(e) => update("email", e.target.value)} placeholder="you@example.com" /></div>

          <div style={{ marginTop: 12, padding: 20, background: "var(--rj-paper-2)", borderRadius: "var(--rj-r-sm)" }}>
            <label style={{ display: "flex", alignItems: "center", gap: 10, fontWeight: 600, fontSize: 14 }}>
              <input type="checkbox" checked={allAgree && data.agree.marketing} onChange={(e) => setData((d) => ({ ...d, agree: { service: e.target.checked, privacy: e.target.checked, marketing: e.target.checked } }))} />
              전체 동의
            </label>
            <div style={{ height: 1, background: "var(--rj-faint)", margin: "14px 0" }} />
            {[
              ["service", "이용약관 동의", true],
              ["privacy", "개인정보 수집·이용 동의", true],
              ["marketing", "마케팅 정보 수신 동의", false],
            ].map(([k, label, req]) => (
              <label key={k} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", fontSize: 13 }}>
                <input type="checkbox" checked={data.agree[k]} onChange={(e) => setData((d) => ({ ...d, agree: { ...d.agree, [k]: e.target.checked } }))} />
                <span>[{req ? "필수" : "선택"}] {label}</span>
                <a href="#/" onClick={(e) => e.preventDefault()} style={{ marginLeft: "auto", color: "var(--rj-muted)", fontSize: 12, textDecoration: "underline" }}>보기</a>
              </label>
            ))}
          </div>
          <button className="btn btn-primary btn-lg btn-block" onClick={next}>다음 <Icon name="arrow" size={14} /></button>
        </div>
      )}

      {/* Step 2 */}
      {step === 2 && (
        <div style={{ marginTop: 32, display: "grid", gap: 18 }}>
          <div className="field"><label>이름</label><input className="input input-lg" value={data.name} onChange={(e) => update("name", e.target.value)} placeholder="한도윤" /></div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <div className="field">
              <label>학년</label>
              <select className="input input-lg" value={data.grade} onChange={(e) => update("grade", e.target.value)}>
                {["중2", "중3", "고1", "고2", "고3", "N수생"].map((g) => <option key={g}>{g}</option>)}
              </select>
            </div>
            <div className="field"><label>학교</label><input className="input input-lg" value={data.school} onChange={(e) => update("school", e.target.value)} placeholder="리뉴젠고등학교" /></div>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
            <button className="btn btn-ghost btn-lg" onClick={() => setStep(1)}><Icon name="arrowLeft" size={14} /> 이전</button>
            <button className="btn btn-primary btn-lg" style={{ flex: 1 }} onClick={next}>다음 <Icon name="arrow" size={14} /></button>
          </div>
        </div>
      )}

      {/* Step 3 */}
      {step === 3 && (
        <div style={{ marginTop: 32 }}>
          <div className="label-cap" style={{ color: "var(--rj-muted)" }}>SUBJECTS · 관심 과목 (복수 선택)</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginTop: 12 }}>
            {window.SUBJECTS.map((s) => (
              <button key={s.id} onClick={() => update("subject", s.id)} style={{
                padding: 16, borderRadius: "var(--rj-r-sm)", border: "1px solid",
                borderColor: data.subject === s.id ? "var(--rj-ink)" : "var(--rj-faint)",
                background: data.subject === s.id ? "var(--rj-ink)" : "transparent",
                color: data.subject === s.id ? "var(--rj-paper)" : "var(--rj-ink)",
                cursor: "pointer",
                fontSize: 14, fontWeight: 600,
              }}>{s.ko}<div style={{ fontFamily: "var(--font-en)", fontStyle: "italic", fontWeight: 300, fontSize: 11, opacity: 0.6, marginTop: 4 }}>{s.en}</div></button>
            ))}
          </div>

          <div className="card-accent" style={{ marginTop: 28, padding: 24 }}>
            <div className="eyebrow">First Week Free</div>
            <div style={{ fontFamily: "var(--font-kr-serif)", fontSize: 24, letterSpacing: "-0.025em", marginTop: 10 }}>회원가입과 동시에 1주차 강의가 열립니다.</div>
            <p style={{ marginTop: 8, fontSize: 13 }}>모든 강의의 1주차 라이브와 다시보기를 결제 없이 시청할 수 있습니다.</p>
          </div>

          <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
            <button className="btn btn-ghost btn-lg" onClick={() => setStep(2)}><Icon name="arrowLeft" size={14} /> 이전</button>
            <button className="btn btn-primary btn-lg" style={{ flex: 1 }} onClick={finish}>가입 완료 → 마이페이지 <Icon name="arrow" size={14} /></button>
          </div>
        </div>
      )}
    </div>
  );
}

  const [pay, setPay] = useStateK({

function OrderSummary({ items, subtotal, bundle, total }) {
  return (
    <div className="card" style={{ padding: 24, position: "sticky", top: 100 }}>
      <h3 style={{ fontFamily: "var(--font-kr-serif)", fontWeight: 500, fontSize: 20, letterSpacing: "-0.025em", margin: 0 }}>주문 요약</h3>
      <div style={{ display: "grid", gap: 12, marginTop: 18, marginBottom: 18 }}>
        {items.map((c) => (
          <div key={c.id} style={{ display: "grid", gridTemplateColumns: "44px 1fr auto", gap: 12, alignItems: "center" }}>
            <div style={{ width: 44, height: 44, borderRadius: 8, background: c.color === "ink" ? "var(--rj-ink)" : c.color === "accent" ? "var(--rj-accent)" : "var(--rj-paper-2)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "var(--font-en)", fontSize: 14, fontWeight: 700, color: c.color === "ink" ? "var(--rj-paper)" : "var(--rj-ink)" }}>{c.no}</div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{c.title}</div>
              <div style={{ fontSize: 11, color: "var(--rj-muted)" }}>{findInstructor(c.instructor)?.name}</div>

  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

                  <div style={{ fontSize: 13, fontWeight: 600 }}>{it.a}</div>
                  <p style={{ margin: "4px 0 0", fontSize: 14, color: "var(--rj-muted)" }}>안녕하세요. 라이브 강의실 입장 시 화면 우상단의 ‘ROOM 코드’가 결제 시 발급된 코드와 일치하는지 먼저 확인해주세요. 자세한 안내는 1:1 채팅으로 도움드리겠습니다.</p>

  <script type="text/babel" data-from="app/main.jsx">
/* global React, ReactDOM, AppProvider, useApp, SiteHeader, SiteFooter,
   HomePage, CoursesPage, CourseDetailPage, LoginPage, SignupPage,
   MyPage, CartPage, CheckoutPage, PlayerPage, LivePage,
   InstructorsPage, InstructorDetailPage, CommunityPage,
   TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakColor, TweakToggle */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "homeStyle": "academy",
  "heroLayout": "split",
  "liveLayout": "split",
  "accent": "primary",
  "darkChrome": false
}/*EDITMODE-END*/;

const ACCENT_PALETTES = {
  primary:    { accent: "#FFD60A", accentInk: "#001D3D", label: "Primary Yellow" },
  butter:     { accent: "#FBF4BD", accentInk: "#001D3D", label: "Butter" },
  matcha:     { accent: "#CFE5BB", accentInk: "#001D3D", label: "Matcha" },
  cobalt:     { accent: "#003566", accentInk: "#FFFBF0", label: "Mid Navy" },
  terracotta: { accent: "#D85A3C", accentInk: "#FFFBF0", label: "Terracotta" },
};

function applyTweaks(t) {
  const root = document.documentElement;
  const pal = ACCENT_PALETTES[t.accent] || ACCENT_PALETTES.butter;
  root.style.setProperty("--rj-accent", pal.accent);
  root.style.setProperty("--rj-accent-ink", pal.accentInk);
  // Switches the global look to academy (megastudy/etoos style) when set.
  if (t.homeStyle === "academy") root.setAttribute("data-home-style", "academy");
  else root.removeAttribute("data-home-style");
}

function Router() {
  const { route } = useApp();
  const path = route.path;
  const seg = path.split("/").filter(Boolean);

  // Routing
  if (path === "/" || seg[0] === "home") return <HomePage />;
  if (seg[0] === "courses") {
    if (seg[1]) return <CourseDetailPage courseId={seg[1]} />;
    return <CoursesPage />;
  }
  if (seg[0] === "instructors") {
    if (seg[1]) return <InstructorDetailPage instructorId={seg[1]} />;
    return <InstructorsPage />;
  }
  if (seg[0] === "live") {
    return <LivePage courseId={seg[1]} />;
  }
  if (seg[0] === "subscribe") return <SubscribePage />;
  if (seg[0] === "about") return <AboutPage />;
  if (seg[0] === "curriculum") return <CurriculumPage />;
  if (seg[0] === "admissions") return <AdmissionsPage />;
  if (seg[0] === "faq") return <FaqPage />;
  if (seg[0] === "player") return <PlayerPage courseId={seg[1]} />;
  if (seg[0] === "community") return <CommunityPage />;
  if (seg[0] === "login") return <LoginPage />;
  if (seg[0] === "signup") return <SignupPage />;
  if (seg[0] === "mypage") return <MyPage />;
  if (seg[0] === "cart") return <CartPage />;
  if (seg[0] === "checkout") return <CheckoutPage />;
  return <HomePage />;
}

function Shell() {
  const { route } = useApp();
  const path = route.path;
  // Player has its own dark chrome — keep header but hide footer
  const isPlayer = path.startsWith("/player");
  const isLiveEntry = path.startsWith("/live/") && route.path.split("/").length > 2;
  const noFooter = isPlayer || isLiveEntry || path.startsWith("/login") || path.startsWith("/signup");
  return (
    <>
      <SiteHeader />
      <main>
        <Router />
      </main>
      {!noFooter && <SiteFooter />}
    </>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => { applyTweaks(tweaks); }, [tweaks]);

  return (
    <AppProvider initialTweaks={tweaks}>
      <Shell />
      <TweaksPanel title="Tweaks · 디자인 옵션">
        <TweakSection label="홈 디자인 스타일" />
        <TweakRadio
          label="홈페이지 톤"
          value={tweaks.homeStyle || "editorial"}
          options={["academy", "editorial"]}
          onChange={(v) => setTweak("homeStyle", v)}
        />
        <div style={{ fontSize: 10.5, color: "rgba(41,38,27,0.55)", marginTop: -4, lineHeight: 1.4 }}>
          academy — 메가스터디·이투스 톤 (빨강·네이비, 강사 빌보드, 합격 실적) / editorial — 잡지 톤 (크림·잉크, 명조)
        </div>

        <TweakSection label="Hero 레이아웃 (editorial 전용)" />
        <TweakRadio
          label="홈 히어로"
          value={tweaks.heroLayout}
          options={["split", "stack", "marquee"]}
          onChange={(v) => setTweak("heroLayout", v)}
        />
        <div style={{ fontSize: 10.5, color: "rgba(41,38,27,0.55)", marginTop: -4, lineHeight: 1.4 }}>
          split — 좌측 헤드라인 + 우측 카드 / stack — 중앙 정렬 에디토리얼 / marquee — 다크 배경 + 강의 마퀴
        </div>

        <TweakSection label="라이브 강의실 레이아웃" />
        <TweakRadio
          label="라이브 화면"
          value={tweaks.liveLayout || "split"}
          options={["split", "stacked"]}
          onChange={(v) => setTweak("liveLayout", v)}
        />
        <div style={{ fontSize: 10.5, color: "rgba(41,38,27,0.55)", marginTop: -4, lineHeight: 1.4 }}>
          split — 좌측 수업 화면 + 우측 채팅/Q&A / stacked — 위에 수업 화면 + 아래 채팅·Q&A 나란히
        </div>

        <TweakSection label="포인트 컬러" />
        <TweakColor
          label="액센트"
          value={tweaks.accent}
          options={Object.keys(ACCENT_PALETTES)}
          onChange={(v) => setTweak("accent", v)}
        />
        <div style={{ display: "grid", gap: 4, marginTop: -2 }}>
          {Object.entries(ACCENT_PALETTES).map(([k, v]) => (
            <button key={k} onClick={() => setTweak("accent", k)} style={{
              display: "flex", alignItems: "center", gap: 8, padding: "6px 8px",
              borderRadius: 6, border: "1px solid",
              borderColor: tweaks.accent === k ? "rgba(0,0,0,0.4)" : "transparent",
              background: tweaks.accent === k ? "rgba(0,0,0,0.05)" : "transparent",
              cursor: "pointer", fontSize: 11.5, textAlign: "left",
            }}>
              <span style={{ width: 18, height: 18, borderRadius: "50%", background: v.accent, border: "1px solid rgba(0,0,0,0.12)" }} />
              <span style={{ flex: 1 }}>{v.label}</span>
              <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 10, color: "rgba(41,38,27,0.5)" }}>{v.accent}</span>
            </button>
          ))}
        </div>

        <TweakSection label="페이지 빠른 이동" />
        <div style={{ display: "grid", gap: 4 }}>
          {[
            ["/",                  "홈 (메인)"],
            ["/about",             "소개 · 비전·설립목적·운영"],
            ["/subscribe",         "구독 · 프리패스"],
            ["/courses",           "강의 목록"],
            ["/courses/math-calc-2026", "강의 상세 — 미적분"],
            ["/instructors",       "강사진"],
            ["/curriculum",        "커리큘럼 · 연 3학기"],
            ["/admissions",        "입시정보 · 점수로 증명"],
            ["/faq",               "FAQ"],
            ["/login",             "로그인"],
            ["/signup",            "회원가입"],
            ["/cart",              "장바구니"],
            ["/checkout",          "결제 (3단계)"],
            ["/mypage",            "마이페이지"],
            ["/live",              "라이브 시간표"],
            ["/live/math-calc-2026?join=1", "라이브 강의실 바로 →"],
          ].map(([p, label]) => (
            <button key={p} onClick={() => { window.location.hash = "#" + p; }} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "6px 10px", borderRadius: 6, border: "1px solid rgba(0,0,0,0.08)",
              background: "transparent", cursor: "pointer", fontSize: 11.5, textAlign: "left",
            }}>
              <span>{label}</span>
              <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 10, color: "rgba(41,38,27,0.45)" }}>#{p}</span>
            </button>
          ))}
        </div>
      </TweaksPanel>
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>

</body>
