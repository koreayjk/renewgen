name: Deploy to Cafe24 (SFTP + SSH Key)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to Cafe24 via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CAFE24_SSH_KEY }}" > ~/.ssh/cafe24_key
          chmod 600 ~/.ssh/cafe24_key

      - name: 📦 Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 📂 Deploy via lftp over SFTP
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/cafe24_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null';
            open -u '${{ secrets.CAFE24_USER }},dummy' sftp://${{ secrets.CAFE24_HOST }};
            mirror -R --delete --verbose \
              --exclude-glob .git \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob .env \
              --exclude-glob .env.* \
              --exclude-glob .DS_Store \
              --exclude-glob *.md \
              --exclude-glob screenshots/ \
              --exclude-glob uploads/ \
              --exclude-glob classin-backend/ \
              --exclude-glob .image-slots.state.json \
              --exclude-glob .thumbnail \
              --exclude-glob *.log \
              ./ /www/;
          "

      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/cafe24_key
