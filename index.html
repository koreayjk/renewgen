  <style>
/* ──────────────────────────────────────────────────────────────────
   Product Review Deck — Design Tokens
   Reconstructed from "Product Review.fig" (1 page, 51 frames, 1920×1080)
   Single typeface: Plus Jakarta Sans (Light 300 / Regular 400 / SemiBold 600 / Bold 700).
   ────────────────────────────────────────────────────────────────── */

@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap");

:root {
  /* ── Core palette (literal RGB values from Figma) ────────────────── */
  --pr-ink:        rgb(0, 0, 0);          /* primary "ink" — backgrounds + body */
  --pr-cream:      rgb(245, 241, 233);    /* warm off-white card / background */
  --pr-butter:     rgb(251, 244, 189);    /* accent yellow — used as highlight panel */
  --pr-paper:      rgb(255, 255, 255);    /* hard white — only used as outer frame on a few slides */

  /* ── Semantic surface tokens ─────────────────────────────────────── */
  --bg:            var(--pr-cream);       /* default page background */
  --bg-inverse:    var(--pr-ink);         /* inverted (dark) background */
  --bg-accent:     var(--pr-butter);      /* attention / metric panel */
  --surface:       var(--pr-cream);       /* card surface */
  --surface-inverse: var(--pr-ink);       /* card surface, dark */

  --fg:            var(--pr-ink);         /* default text on cream */
  --fg-inverse:    var(--pr-cream);       /* default text on ink */
  --fg-muted:      rgba(0, 0, 0, 0.55);   /* secondary copy (rare in source — be sparing) */

  --border:        rgb(0, 0, 0);          /* hairline border, always 1px */
  --border-inverse: rgb(245, 241, 233);   /* hairline border on dark surfaces */

  /* ── Type ────────────────────────────────────────────────────────── */
  --font-display:  "Plus Jakarta Sans", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-body:     "Plus Jakarta Sans", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;

  --weight-light:    300;
  --weight-regular:  400;
  --weight-semibold: 600;  /* most-used weight in source */
  --weight-bold:     700;

  /* Tracking — design uses tight leading and gentle negative tracking on big type */
  --track-tight:    -0.050em;   /* huge numerals ("01", "02") */
  --track-display:  -0.022em;   /* H2 / Body — most copy */
  --track-cap:       0.070em;   /* ALL-CAPS labels (Note, H3 Medium) */

  /* Line heights — every Figma node uses 1.1 for headings, 1.5 for body */
  --leading-tight: 1.1;
  --leading-body:  1.5;

  /* Type scale (px values are the literal Figma values for 1920×1080) */
  --fs-mega:    700px;  /* the giant "01" / "02" section number */
  --fs-h1:      150px;  /* "Product Review" title */
  --fs-h2:       70px;  /* slide H2 */
  --fs-h3:       40px;  /* ALL-CAPS section / metric label */
  --fs-h3-reg:   36px;  /* sentence-case subhead */
  --fs-body:     22px;  /* body copy + Note row */

  /* ── Radius / spacing / shape ────────────────────────────────────── */
  --r-card:    15px;    /* every cropped card uses 15px */
  --r-pill:    100px;   /* dot / bullet */
  --hairline:  1px;     /* the only border weight in the system */

  --frame-margin: 19px; /* outer gutter between viewport edge and card */
  --frame-top:    50px; /* vertical inset to top of card */
  --note-gutter:  140px;/* space the Note rail occupies above the card */
  --gap-cols:     20px; /* column gap between split cards (621 - 19 - 582) */

  /* ── Effects ─────────────────────────────────────────────────────── */
  --shadow-none: none;  /* this system intentionally uses NO shadows */
}

/* ────────────────────────────────────────────────────────────────────
   Semantic element styles — apply directly to tags or via class.
   ──────────────────────────────────────────────────────────────────── */

.pr-mega,
.pr-h1,
.pr-h2,
.pr-h3,
.pr-h3-reg,
.pr-body,
.pr-note {
  font-family: var(--font-display);
  margin: 0;
  color: inherit;
}

.pr-mega {
  font-weight: var(--weight-regular);
  font-size: var(--fs-mega);
  line-height: var(--leading-tight);
  letter-spacing: var(--track-tight);
}

.pr-h1, h1.pr {
  font-weight: var(--weight-bold);
  font-size: var(--fs-h1);
  line-height: var(--leading-tight);
}
.pr-h1--light { font-weight: var(--weight-light); }

.pr-h2, h2.pr {
  font-weight: var(--weight-regular);
  font-size: var(--fs-h2);
  line-height: var(--leading-tight);
  letter-spacing: var(--track-display);
}

.pr-h3, h3.pr {
  font-weight: var(--weight-bold);
  font-size: var(--fs-h3);
  line-height: var(--leading-body);
  letter-spacing: var(--track-cap);
  text-transform: uppercase;
}

.pr-h3-reg {
  font-weight: var(--weight-regular);
  font-size: var(--fs-h3-reg);
  line-height: var(--leading-body);
  letter-spacing: var(--track-display);
}

.pr-body, p.pr {
  font-weight: var(--weight-regular);
  font-size: var(--fs-body);
  line-height: var(--leading-body);
  letter-spacing: var(--track-display);
}

.pr-note {
  font-weight: var(--weight-bold);
  font-size: var(--fs-body);
  line-height: var(--leading-tight);
  letter-spacing: var(--track-cap);
  text-transform: uppercase;
}

/* Card — the core container of every slide */
.pr-card {
  background: var(--surface);
  border-radius: var(--r-card);
  overflow: hidden;
}
.pr-card--ink   { background: var(--surface-inverse); color: var(--fg-inverse); }
.pr-card--butter{ background: var(--bg-accent); }
.pr-card--outline {
  background: transparent;
  border: var(--hairline) solid var(--border);
}
.pr-card--outline-inverse {
  background: transparent;
  border: var(--hairline) solid var(--border-inverse);
}

  </style>
  <style>
/* ──────────────────────────────────────────────────────────────────
   Renewjen Academy — Site styles
   Extends the Product Review Deck design tokens (colors_and_type.css)
   ────────────────────────────────────────────────────────────────── */

@import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap");
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

:root {
  /* Site uses Pretendard for Korean UI/body, Noto Serif KR for editorial display, Plus Jakarta Sans for English accents */
  --font-kr:      "Pretendard Variable", Pretendard, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --font-kr-serif:"Noto Serif KR", "Iowan Old Style", Georgia, serif;
  --font-en:      "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;

  /* Resolved palette — overrideable for tweak: accent */
  --rj-ink:    #001D3D;
  --rj-paper:  #FFFBF0;
  --rj-paper-2:#F5F0E0;       /* cream — surface differentiation */
  --rj-line:   #001D3D;
  --rj-muted:  rgba(0,29,61,0.55);
  --rj-faint:  rgba(0,29,61,0.12);
  --rj-accent: #FFD60A;       /* primary yellow (default) */
  --rj-accent-ink: #001D3D;   /* navy text on accent */

  --rj-r:      14px;
  --rj-r-sm:   6px;
  --rj-r-pill: 999px;

  --rj-shell-pad: 32px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-kr);
  background: var(--rj-paper);
  color: var(--rj-ink);
  font-size: 15px;
  line-height: 1.55;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, select, textarea { font-family: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

/* ── Editorial type utilities ───────────────────────────────────── */
.eyebrow {
  font-family: var(--font-en);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::before {
  content: "";
  display: inline-block;
  width: 18px;
  height: 1px;
  background: currentColor;
  opacity: 0.5;
}
.eyebrow.no-rule::before { display: none; }

.display {
  font-family: var(--font-kr-serif);
  font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1.05;
}
.display-en {
  font-family: var(--font-en);
  font-weight: 300;
  letter-spacing: -0.04em;
  line-height: 0.95;
  font-style: italic;
}

.body-lg { font-size: 17px; line-height: 1.65; letter-spacing: -0.015em; }
.label-cap {
  font-family: var(--font-en);
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.num-en {
  font-family: var(--font-en);
  font-feature-settings: "tnum";
  letter-spacing: -0.02em;
}

/* ── Layout helpers ─────────────────────────────────────────────── */
.container {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px;
}
.container-wide {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 40px;
}

.hairline { background: var(--rj-line); height: 1px; width: 100%; }
.hairline-soft { background: var(--rj-faint); height: 1px; width: 100%; }

/* ── Buttons ────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 44px;
  padding: 0 22px;
  border-radius: var(--rj-r-pill);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.01em;
  transition: opacity 0.15s ease, transform 0.15s ease, background 0.15s ease;
  white-space: nowrap;
}
.btn:hover { opacity: 0.85; }
.btn:active { opacity: 0.7; transform: scale(0.98); }
.btn-primary { background: var(--rj-ink); color: var(--rj-paper); }
.btn-accent  { background: var(--rj-accent); color: var(--rj-accent-ink); }
.btn-ghost   { background: transparent; color: var(--rj-ink); border: 1px solid var(--rj-line); }
.btn-soft    { background: var(--rj-paper-2); color: var(--rj-ink); }
.btn-link    { background: none; color: var(--rj-ink); height: auto; padding: 0; border-radius: 0; text-decoration: underline; text-underline-offset: 4px; }
.btn-sm      { height: 36px; padding: 0 16px; font-size: 13px; }
.btn-lg      { height: 54px; padding: 0 28px; font-size: 15px; }
.btn-block   { width: 100%; }
.btn-circle  { width: 44px; height: 44px; padding: 0; border-radius: 50%; }

/* ── Inputs ─────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label {
  font-family: var(--font-en);
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--rj-muted);
}
.input {
  height: 48px;
  padding: 0 16px;
  border: 1px solid var(--rj-line);
  border-radius: var(--rj-r-sm);
  background: transparent;
  font-size: 15px;
  outline: none;
  transition: box-shadow 0.15s ease;
}
.input:focus { box-shadow: inset 0 0 0 1px var(--rj-ink); }
.input-lg { height: 56px; font-size: 16px; }
.input::placeholder { color: var(--rj-muted); }

/* ── Cards ──────────────────────────────────────────────────────── */
.card {
  background: var(--rj-paper);
  border: 1px solid var(--rj-line);
  border-radius: var(--rj-r);
  overflow: hidden;
}
.card-ink {
  background: var(--rj-ink);
  color: var(--rj-paper);
  border-radius: var(--rj-r);
  overflow: hidden;
}
.card-soft {
  background: var(--rj-paper-2);
  border-radius: var(--rj-r);
  overflow: hidden;
}
.card-accent {
  background: var(--rj-accent);
  color: var(--rj-accent-ink);
  border-radius: var(--rj-r);
  overflow: hidden;
}

/* ── Pill / chips ───────────────────────────────────────────────── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 12px;
  border-radius: var(--rj-r-pill);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.005em;
  border: 1px solid var(--rj-faint);
  background: transparent;
}
.chip-ink  { background: var(--rj-ink); color: var(--rj-paper); border-color: var(--rj-ink); }
.chip-live { background: var(--rj-accent, #FFD60A); color: #001D3D; border-color: var(--rj-accent, #FFD60A); }
.chip-live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #001D3D; box-shadow: 0 0 0 0 rgba(0,29,61,0.5); animation: pulse 1.6s ease-out infinite; }
.chip-accent { background: var(--rj-accent); color: var(--rj-accent-ink); border-color: var(--rj-accent); }

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
  100% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
}

/* ── Header / nav ───────────────────────────────────────────────── */
.site-header {
  position: sticky;
  top: 0;
  background: rgba(245, 241, 233, 0.92);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--rj-faint);
  z-index: 50;
}
.site-header-inner {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: 72px;
}
.brand-wordmark {
  font-family: var(--font-kr-serif);
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.02em;
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
}
.brand-wordmark .en {
  font-family: var(--font-en);
  font-style: italic;
  font-weight: 300;
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--rj-muted);
  margin-left: 4px;
}
.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--rj-ink);
  color: var(--rj-paper);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-en);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -0.02em;
}
/* Brand logo image — replaces the .brand-mark circle when used */
.brand-logo-mark {
  display: inline-block;
  height: 34px;
  width: auto;
  flex-shrink: 0;
  vertical-align: middle;
  user-select: none;
}
.brand-logo-mark--sm { height: 26px; }
.brand-logo-mark--lg { height: 44px; }
.brand-logo-full {
  display: inline-block;
  height: 38px;
  width: auto;
  flex-shrink: 0;
  user-select: none;
}
.brand-logo-full--lg { height: 56px; }
/* On dark surfaces the natural yellow already pops; on cream surfaces it's a
   warm sibling to the butter accent. No filter needed. */
.main-nav {
  display: flex;
  gap: 28px;
  align-items: center;
}
.main-nav a {
  font-size: 14px;
  font-weight: 500;
  color: var(--rj-ink);
  position: relative;
  padding: 8px 0;
  white-space: nowrap;
}
.main-nav a.active::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--rj-ink);
}
.main-nav a:hover { opacity: 0.6; }
.header-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  align-items: center;
}
.icon-btn {
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  position: relative;
}
.icon-btn:hover { background: var(--rj-paper-2); }
.icon-btn .badge {
  position: absolute;
  top: 4px;
  right: 4px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  background: var(--rj-ink);
  color: var(--rj-paper);
  font-family: var(--font-en);
  font-weight: 700;
  font-size: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

/* ── Footer ─────────────────────────────────────────────────────── */
.site-footer {
  background: var(--rj-ink);
  color: var(--rj-paper);
  padding: 80px 0 32px;
  margin-top: 120px;
}
.site-footer a:hover { opacity: 0.6; }

/* ── Page transitions ──────────────────────────────────────────── */
.page-enter { animation: pageIn 0.4s ease-out both; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Scrollbar polish ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.22); }

/* ── Misc UI primitives ────────────────────────────────────────── */
.cover {
  position: relative;
  background: var(--rj-paper-2);
  overflow: hidden;
  border-radius: var(--rj-r);
}
.cover-grad {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 80% at 20% 20%, rgba(0,0,0,0.0), rgba(0,0,0,0.45) 100%),
    linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.6));
}
.cover-meta {
  position: absolute;
  bottom: 16px;
  left: 16px;
  right: 16px;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
}

.ratio-16x9 { aspect-ratio: 16 / 9; }
.ratio-4x5  { aspect-ratio: 4 / 5; }
.ratio-1x1  { aspect-ratio: 1 / 1; }

/* Avatars (initials, no fake photos) */
.avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--rj-paper-2);
  color: var(--rj-ink);
  font-family: var(--font-kr-serif);
  font-weight: 500;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}
.avatar-sm { width: 32px; height: 32px; font-size: 13px; }
.avatar-md { width: 48px; height: 48px; font-size: 18px; }
.avatar-lg { width: 80px; height: 80px; font-size: 30px; }
.avatar-xl { width: 140px; height: 140px; font-size: 52px; }

/* Course poster — editorial composition, no photo */
.poster {
  position: relative;
  background: var(--rj-paper);
  border: 1px solid var(--rj-line);
  border-radius: var(--rj-r);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 22px;
  aspect-ratio: 4 / 5;
}
.poster-ink   { background: var(--rj-ink); color: var(--rj-paper); }
.poster-cream { background: var(--rj-paper); color: var(--rj-ink); }
.poster-accent{ background: var(--rj-accent); color: var(--rj-accent-ink); }
.poster-deep  { background: var(--rj-paper-2); color: var(--rj-ink); }

.poster-num {
  font-family: var(--font-en);
  font-weight: 300;
  font-size: 140px;
  letter-spacing: -0.05em;
  line-height: 0.85;
  opacity: 0.95;
}
.poster-title {
  font-family: var(--font-kr-serif);
  font-weight: 500;
  font-size: 24px;
  letter-spacing: -0.025em;
  line-height: 1.2;
}

/* Common section header */
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 28px;
}
.section-head h2 {
  margin: 0;
  font-family: var(--font-kr-serif);
  font-weight: 500;
  font-size: 36px;
  letter-spacing: -0.025em;
  line-height: 1.15;
}
.section-head .lead-en {
  font-family: var(--font-en);
  font-style: italic;
  font-weight: 300;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--rj-muted);
  margin-top: 6px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--rj-ink);
  color: var(--rj-paper);
  padding: 12px 22px;
  border-radius: var(--rj-r-pill);
  font-size: 13px;
  font-weight: 500;
  z-index: 100;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  animation: toastIn 0.25s ease-out;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10,10,10,0.45);
  backdrop-filter: blur(6px);
  z-index: 80;
  display: flex; align-items: center; justify-content: center;
  padding: 40px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--rj-paper);
  border-radius: var(--rj-r);
  max-width: 460px;
  width: 100%;
  padding: 32px;
  position: relative;
  animation: modalIn 0.25s cubic-bezier(.2,.8,.2,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Tag for level/subject */
.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border: 1px solid var(--rj-line);
  border-radius: 4px;
  font-family: var(--font-en);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* Empty grid pattern (for hero illustration placeholders) */
.dot-grid {
  background-image: radial-gradient(rgba(0,0,0,0.2) 1px, transparent 1px);
  background-size: 16px 16px;
}

/* ──────────────────────────────────────────────────────────────────
   ACADEMY MODE — Megastudy / Etoos / Daesung style
   Bold red·navy, Pretendard heavy, instructor billboards,
   acceptance brag bar, ranking lists, D-day countdown.
   Activated via [data-home-style="academy"] on <html>.
   ────────────────────────────────────────────────────────────────── */
:root {
  /* Navy + Yellow brand — no red. Deep navy leads, yellow is the single pop
     accent, warm-white/cream are the surfaces.
     --acad-red is kept as a token name but now resolves to deep navy so every
     legacy "solid accent + white text" use stays high-contrast and on-palette. */
  --acad-red:      #001D3D;   /* repurposed: deep navy solid accent */
  --acad-red-deep: #00132A;   /* darker navy for active/press */
  --acad-navy:     #001D3D;   /* deep navy (hero, footer, dark surfaces) */
  --acad-navy-2:   #003566;   /* mid navy (secondary dark surface) */
  --acad-ink:      #001D3D;   /* body text — deep navy */
  --acad-bg:       #F5F0E0;   /* cream page background */
  --acad-bg-2:     #ECE4CE;   /* deeper cream — surface differentiation */
  --acad-line:     #E4DCC6;   /* warm hairline */
  --acad-muted:    #5C6678;   /* muted navy-gray text */
  --acad-yellow:   #FFD60A;   /* primary yellow — the pop accent */
  --acad-paper:    #FFFBF0;   /* warm white — cards */
}

html[data-home-style="academy"],
html[data-home-style="academy"] body {
  background: var(--acad-bg);
  color: var(--acad-ink);
  letter-spacing: -0.018em;
}
/* Header chrome shifts to white/navy in academy mode */
html[data-home-style="academy"] .site-header {
  background: var(--acad-paper);
  border-bottom: 1px solid var(--acad-line);
  backdrop-filter: none;
}
html[data-home-style="academy"] .brand-wordmark {
  font-family: var(--font-kr);
  font-weight: 800;
  letter-spacing: -0.035em;
  font-size: 21px;
}
html[data-home-style="academy"] .brand-wordmark .en { display: none; }
html[data-home-style="academy"] .brand-mark {
  background: var(--acad-red);
  color: #fff;
  border-radius: 7px;
  font-family: var(--font-kr);
  font-weight: 900;
  font-size: 15px;
  width: 32px; height: 32px;
}
html[data-home-style="academy"] .main-nav a { font-weight: 700; font-size: 15px; white-space: nowrap; }
html[data-home-style="academy"] .main-nav { gap: 26px; }
html[data-home-style="academy"] .main-nav a.active { color: var(--acad-red); }
html[data-home-style="academy"] .main-nav a.active::after {
  background: var(--acad-red);
  width: 6px; height: 6px;
}
html[data-home-style="academy"] .btn-primary {
  background: var(--acad-red); color: #fff;
  border-radius: 6px; font-weight: 800;
}

/* ── Academy hero ── */
.acad-hero {
  background: var(--acad-navy);
  color: #fff;
  overflow: hidden;
  position: relative;
}
.acad-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(60% 80% at 90% 10%, rgba(0,29,61,0.35), transparent 60%),
    radial-gradient(40% 60% at 10% 100%, rgba(255,214,10,0.10), transparent 60%);
  pointer-events: none;
}
.acad-hero-inner {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 48px;
  padding-top: 72px;
  padding-bottom: 56px;
  align-items: center;
}
.acad-tag-red {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--acad-yellow); color: var(--acad-ink);
  font-weight: 800; font-size: 13px;
  padding: 7px 12px; border-radius: 4px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.acad-tag-red::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--acad-ink); box-shadow: 0 0 0 0 rgba(0,29,61,0.55);
  animation: pulse 1.6s ease-out infinite;
}
.acad-headline {
  font-weight: 900;
  font-size: clamp(48px, 5.6vw, 78px);
  line-height: 1.05;
  letter-spacing: -0.045em;
  margin: 18px 0 0;
}
.acad-headline em {
  font-style: normal;
  color: var(--acad-yellow);
  background: linear-gradient(180deg, transparent 60%, rgba(255,214,10,0.25) 60%);
  padding: 0 2px;
}
.acad-sub {
  font-size: 17px; line-height: 1.6;
  color: rgba(255,255,255,0.78);
  max-width: 520px;
  margin-top: 20px;
  font-weight: 500;
}
.acad-dday {
  display: inline-grid;
  grid-template-columns: auto 1px auto;
  gap: 18px;
  align-items: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 10px;
  padding: 12px 18px;
  margin-top: 28px;
}
.acad-dday-label {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(255,255,255,0.7); font-weight: 700;
}
.acad-dday-num {
  font-family: var(--font-en);
  font-weight: 800;
  font-size: 30px;
  letter-spacing: -0.02em;
  color: var(--acad-yellow);
  white-space: nowrap;
}
.acad-dday-sep { height: 28px; background: rgba(255,255,255,0.2); }

/* Big CTA buttons under hero */
.acad-btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 54px; padding: 0 26px;
  border-radius: 7px;
  font-weight: 800; font-size: 15px;
  letter-spacing: -0.01em;
  transition: opacity 0.15s ease, transform 0.15s ease;
  white-space: nowrap;
}
.acad-btn:active { transform: scale(0.98); }
.acad-btn:hover { opacity: 0.9; }
.acad-btn-red { background: var(--acad-yellow); color: var(--acad-ink); }   /* primary pop = yellow */
.acad-btn-yellow { background: var(--acad-paper); color: var(--acad-ink); } /* secondary = warm white */
.acad-btn-ghost-white { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.55); }
.acad-btn-ghost { background: transparent; color: var(--acad-ink); border: 1.5px solid var(--acad-line); }

/* Acceptance brag bar */
.acad-bragbar {
  background: var(--acad-paper);
  border-top: 4px solid var(--acad-red);
  border-bottom: 1px solid var(--acad-line);
}
.acad-bragbar-inner {
  display: grid;
  grid-template-columns: auto repeat(5, 1fr);
  align-items: center;
  gap: 0;
  padding-top: 28px;
  padding-bottom: 28px;
}
.acad-bragbar-title {
  display: flex; flex-direction: column;
  padding-right: 28px; border-right: 1px solid var(--acad-line);
}
.acad-bragbar-title small {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--acad-red); font-weight: 800;
}
.acad-bragbar-title strong {
  font-weight: 900; font-size: 22px; margin-top: 4px;
  letter-spacing: -0.035em;
}
.acad-bragbar-cell {
  padding: 0 24px;
  border-right: 1px solid var(--acad-line);
  text-align: center;
}
.acad-bragbar-cell:last-child { border-right: 0; }
.acad-bragbar-num {
  font-family: var(--font-en);
  font-weight: 800; font-size: 36px;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--acad-navy);
}
.acad-bragbar-num sup {
  font-size: 16px; font-weight: 700;
  color: var(--acad-red); margin-left: 2px;
  vertical-align: top;
}
.acad-bragbar-label {
  margin-top: 8px;
  font-size: 13px; color: var(--acad-muted); font-weight: 600;
}

/* Section base */
.acad-section { padding-top: 80px; padding-bottom: 80px; }
.acad-section-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 28px;
  gap: 20px;
}
.acad-section-head h2 {
  margin: 0;
  font-weight: 900;
  font-size: 36px;
  letter-spacing: -0.035em;
  line-height: 1.15;
}
.acad-section-head h2 em {
  font-style: normal; color: var(--acad-red);
}
.acad-section-head .sub {
  margin-top: 8px;
  color: var(--acad-muted);
  font-size: 14px; font-weight: 500;
}

/* Instructor billboards */
.acad-instructors {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.acad-ins-card {
  background: var(--acad-paper);
  border: 1px solid var(--acad-line);
  border-radius: 10px;
  overflow: hidden;
  display: flex; flex-direction: column;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.acad-ins-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(11,30,63,0.10);
}
.acad-ins-face {
  position: relative;
  aspect-ratio: 4 / 5;
  background:
    linear-gradient(180deg, rgba(11,30,63,0.0) 50%, rgba(11,30,63,0.85) 100%),
    var(--acad-navy);
  overflow: hidden;
  color: #fff;
}
.acad-ins-face::before {
  /* placeholder portrait: huge initials, soft glow */
  content: attr(data-initials);
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-kr-serif);
  font-weight: 500;
  font-size: 84px;
  color: rgba(255,255,255,0.92);
  letter-spacing: -0.04em;
}
.acad-ins-badge {
  position: absolute;
  top: 12px; left: 12px;
  background: var(--acad-yellow); color: var(--acad-ink);
  font-weight: 900; font-size: 12px;
  padding: 5px 9px; border-radius: 4px;
  letter-spacing: 0.02em;
  white-space: nowrap;
  z-index: 2;
}
.acad-ins-subj {
  position: absolute;
  top: 12px; right: 12px;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  color: #fff; font-weight: 700; font-size: 12px;
  padding: 5px 9px; border-radius: 4px;
  white-space: nowrap;
  z-index: 2;
}
.acad-ins-name {
  position: absolute;
  left: 16px; right: 16px; bottom: 14px;
  z-index: 2;
}
.acad-ins-name strong {
  display: block; font-weight: 900; font-size: 28px;
  letter-spacing: -0.035em; line-height: 1;
}
.acad-ins-name span {
  display: block; font-size: 12px; opacity: 0.85; margin-top: 6px;
}
.acad-ins-body {
  padding: 16px 18px 18px;
}
.acad-ins-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--acad-line);
}
.acad-ins-stats div { text-align: center; }
.acad-ins-stats strong {
  display: block;
  font-family: var(--font-en);
  font-weight: 800; font-size: 17px;
  color: var(--acad-navy);
  letter-spacing: -0.02em;
}
.acad-ins-stats small {
  font-size: 11px; color: var(--acad-muted); font-weight: 600;
}
.acad-ins-bio {
  font-size: 13px; color: var(--acad-muted);
  line-height: 1.5; margin: 0;
  min-height: 58px;
}

/* Ranking list */
.acad-rank {
  background: var(--acad-paper);
  border: 1px solid var(--acad-line);
  border-radius: 12px;
  overflow: hidden;
}
.acad-rank-tabs {
  display: flex;
  border-bottom: 1px solid var(--acad-line);
}
.acad-rank-tab {
  flex: 1; padding: 16px 0;
  font-weight: 800; font-size: 14px;
  color: var(--acad-muted);
  background: transparent;
  border: 0; cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.15s ease;
}
.acad-rank-tab.active {
  color: var(--acad-red);
  border-bottom-color: var(--acad-red);
  background: rgba(0,29,61,0.04);
}
.acad-rank-tab:hover:not(.active) {
  background: var(--acad-bg-2);
}
.acad-rank-row {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  padding: 18px 20px;
  border-top: 1px solid var(--acad-line);
  gap: 16px;
  text-align: left;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s ease;
  width: 100%;
}
.acad-rank-row:first-of-type { border-top: 0; }
.acad-rank-row:hover { background: var(--acad-bg-2); }
.acad-rank-no {
  font-family: var(--font-en);
  font-weight: 800;
  font-size: 30px;
  letter-spacing: -0.04em;
  color: var(--acad-ink);
}
.acad-rank-row.top .acad-rank-no { color: var(--acad-red); }
.acad-rank-title {
  font-weight: 800; font-size: 16px;
  letter-spacing: -0.025em;
  color: var(--acad-ink);
  margin-bottom: 4px;
}
.acad-rank-meta {
  font-size: 12.5px; color: var(--acad-muted);
  display: flex; gap: 10px; align-items: center;
}
.acad-rank-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: 0.6; }
.acad-rank-trend {
  display: inline-flex; align-items: center; gap: 4px;
  font-weight: 800; font-size: 12px;
  padding: 3px 8px; border-radius: 4px;
}
.acad-rank-trend.up { background: rgba(0,29,61,0.10); color: var(--acad-red); }
.acad-rank-trend.flat { background: var(--acad-bg-2); color: var(--acad-muted); }
.acad-rank-trend.new { background: var(--acad-yellow); color: var(--acad-ink); }

/* Course card grid (academy variant) */
.acad-courses {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.acad-course-card {
  background: var(--acad-paper);
  border: 1px solid var(--acad-line);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  display: flex; flex-direction: column;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.acad-course-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(11,30,63,0.10);
}
.acad-course-cover {
  position: relative;
  aspect-ratio: 16 / 10;
  background: var(--acad-navy);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.acad-course-cover .subj {
  font-weight: 900; font-size: 46px;
  letter-spacing: -0.035em;
  color: rgba(255,255,255,0.95);
}
.acad-course-cover .subj-en {
  position: absolute;
  left: 16px; bottom: 14px;
  font-family: var(--font-en);
  font-weight: 700; font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}
.acad-course-cover .pill {
  position: absolute;
  top: 12px; left: 12px;
  background: var(--acad-yellow); color: var(--acad-ink);
  font-weight: 800; font-size: 11px;
  padding: 4px 8px; border-radius: 4px;
  letter-spacing: 0.02em;
}
.acad-course-cover .pill.new { background: var(--acad-navy); color: #fff; }
.acad-course-body {
  padding: 16px 18px 18px;
  display: flex; flex-direction: column;
  gap: 10px;
  flex: 1;
}
.acad-course-title {
  font-weight: 800; font-size: 16.5px;
  letter-spacing: -0.025em;
  line-height: 1.3;
  color: var(--acad-ink);
}
.acad-course-ins {
  font-size: 13px; color: var(--acad-muted); font-weight: 600;
}
.acad-course-meta {
  margin-top: auto;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 12px; border-top: 1px solid var(--acad-line);
}
.acad-price-now {
  font-family: var(--font-en);
  font-weight: 800; font-size: 18px;
  color: var(--acad-red);
  letter-spacing: -0.02em;
}
.acad-price-old {
  font-family: var(--font-en);
  font-size: 12px; color: var(--acad-muted);
  text-decoration: line-through;
}
.acad-rating {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12.5px; color: var(--acad-muted); font-weight: 600;
}
.acad-rating svg { color: #F5A623; }

/* Live timetable */
.acad-timetable {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.acad-tt-row {
  display: grid;
  grid-template-columns: 110px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  background: var(--acad-paper);
  border: 1px solid var(--acad-line);
  border-radius: 10px;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.acad-tt-row.live {
  border-color: var(--acad-red);
  background: linear-gradient(90deg, rgba(0,29,61,0.04), transparent 50%);
}
.acad-tt-row:hover { transform: translateX(4px); }
.acad-tt-time {
  font-family: var(--font-en);
  font-weight: 800; font-size: 22px;
  letter-spacing: -0.025em;
  color: var(--acad-ink);
}
.acad-tt-state {
  font-size: 11px; font-weight: 800;
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-top: 4px;
  color: var(--acad-muted);
}
.acad-tt-row.live .acad-tt-state { color: var(--acad-red); }
.acad-tt-title { font-weight: 800; font-size: 15px; letter-spacing: -0.025em; margin-bottom: 4px; }
.acad-tt-meta { font-size: 12.5px; color: var(--acad-muted); }
.acad-tt-cta {
  height: 38px; padding: 0 16px;
  border-radius: 5px; font-weight: 800; font-size: 13px;
  background: var(--acad-navy); color: #fff;
  white-space: nowrap;
}
.acad-tt-row.live .acad-tt-cta { background: var(--acad-yellow); color: var(--acad-ink); }

/* Quote / review cards */
.acad-reviews {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
}
.acad-review {
  background: var(--acad-paper);
  border: 1px solid var(--acad-line);
  border-radius: 10px;
  padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
}
.acad-review .stars { color: #F5A623; display: inline-flex; gap: 2px; }
.acad-review-body {
  font-size: 15px; line-height: 1.55; font-weight: 600;
  color: var(--acad-ink);
}
.acad-review-meta {
  margin-top: auto; padding-top: 14px; border-top: 1px solid var(--acad-line);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12.5px; color: var(--acad-muted);
}
.acad-review-pass {
  background: var(--acad-yellow); color: var(--acad-ink);
  font-weight: 800; font-size: 11px;
  padding: 3px 7px; border-radius: 3px;
  white-space: nowrap;
}

/* Big CTA strip */
.acad-cta {
  background: var(--acad-red);
  color: #fff;
  border-radius: 14px;
  padding: 56px 56px;
  display: grid; grid-template-columns: 1.5fr 1fr;
  gap: 32px; align-items: center;
  overflow: hidden;
  position: relative;
}
.acad-cta::after {
  content: "FREE TRIAL · NO RISK";
  position: absolute;
  right: -40px; top: 16px;
  font-family: var(--font-en);
  font-weight: 900; font-size: 11px;
  letter-spacing: 0.4em;
  color: rgba(255,255,255,0.15);
  transform: rotate(0deg);
  white-space: nowrap;
}
.acad-cta h2 {
  margin: 0;
  font-weight: 900; font-size: 46px;
  letter-spacing: -0.04em; line-height: 1.05;
}
.acad-cta p { margin: 16px 0 0; font-size: 16px; font-weight: 500; opacity: 0.9; max-width: 480px; }

/* ──────────────────────────────────────────────────────────────────
   LIVE CLASSROOM — in-site live class shell
   Works in both editorial and academy modes. Uses academy palette
   when active for consistency.
   ────────────────────────────────────────────────────────────────── */
.liveroom {
  position: fixed;
  inset: 72px 0 0 0; /* below site header */
  background: #0B1117;
  color: #fff;
  display: flex;
  flex-direction: column;
  font-family: var(--font-kr);
  z-index: 30;
}
/* Top status bar */
.lr-top {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: #0F1722;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.lr-top-title {
  display: flex; align-items: center; gap: 12px;
  min-width: 0; flex: 1;
}
.lr-live-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--acad-red); color: #fff;
  font-weight: 800; font-size: 12px;
  padding: 5px 10px; border-radius: 4px;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.lr-live-pill::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 0 rgba(255,255,255,0.7);
  animation: pulse 1.4s ease-out infinite;
}
.lr-title { font-weight: 800; font-size: 16px; letter-spacing: -0.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr-sub { font-size: 12.5px; color: rgba(255,255,255,0.55); margin-left: 12px; white-space: nowrap; }
.lr-top-meta {
  display: flex; gap: 18px; align-items: center; font-size: 13px;
  color: rgba(255,255,255,0.75);
}
.lr-top-meta b { color: #fff; font-family: var(--font-en); font-weight: 700; letter-spacing: -0.01em; }
.lr-leave {
  background: rgba(255,255,255,0.08);
  color: #fff; border: 1px solid rgba(255,255,255,0.15);
  font-weight: 700; font-size: 13px;
  height: 36px; padding: 0 14px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.lr-leave:hover { background: rgba(0,29,61,0.85); border-color: var(--acad-red); }

/* Main area */
.lr-main {
  flex: 1;
  display: grid;
  min-height: 0; /* allow children to scroll */
}
.lr-main[data-layout="split"]   { grid-template-columns: 1fr 360px; }
.lr-main[data-layout="stacked"] { grid-template-rows: 1fr 320px; grid-template-columns: 1fr; }

/* Stage = whiteboard + cam */
.lr-stage {
  position: relative;
  background: #0a0d12;
  overflow: hidden;
  display: flex; flex-direction: column;
  min-height: 0;
}
.lr-stage-inner {
  flex: 1;
  position: relative;
  margin: 14px;
  background: #FAFAF7;
  color: var(--acad-ink);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
}
/* Whiteboard grid pattern */
.lr-board {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(11,30,63,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(11,30,63,0.06) 1px, transparent 1px);
  background-size: 28px 28px;
  background-position: -1px -1px;
}
.lr-board-title {
  position: absolute;
  top: 24px; left: 28px; right: 28px;
  display: flex; align-items: baseline; gap: 14px;
  font-weight: 800; font-size: 15px;
  letter-spacing: -0.02em;
  color: var(--acad-navy);
  padding-bottom: 12px;
  border-bottom: 2px solid var(--acad-navy);
}
.lr-board-title em {
  font-style: normal; color: var(--acad-red); font-weight: 800;
}
.lr-board-title small {
  margin-left: auto;
  font-weight: 600; font-size: 12px; color: var(--acad-muted);
  letter-spacing: 0.04em;
}
.lr-board-content {
  position: absolute;
  top: 84px; left: 28px; right: 28px; bottom: 28px;
  display: flex; flex-direction: column;
  gap: 18px;
  overflow: hidden;
}
.lr-eq {
  font-family: "Iowan Old Style", "Times New Roman", Georgia, serif;
  font-size: 30px;
  color: var(--acad-ink);
  letter-spacing: -0.005em;
}
.lr-eq em { font-style: italic; }
.lr-eq .red { color: var(--acad-red); font-weight: 700; }
.lr-eq .blue { color: var(--acad-navy); font-weight: 700; }
.lr-eq .marker { background: linear-gradient(transparent 55%, rgba(255,214,10,0.55) 55%); padding: 0 2px; }
.lr-arrow {
  display: inline-flex; align-items: center;
  color: var(--acad-red);
  font-weight: 800; font-size: 14px;
  letter-spacing: 0;
  margin-left: 8px;
}
.lr-note {
  font-family: var(--font-kr);
  color: var(--acad-red);
  font-size: 15px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 6px;
}
.lr-note::before { content: "※"; font-size: 14px; }
.lr-tag {
  display: inline-block;
  background: var(--acad-navy);
  color: #fff;
  font-weight: 800; font-size: 11px;
  padding: 4px 8px; border-radius: 3px;
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}

/* Cam PIP */
.lr-cam {
  position: absolute;
  right: 28px; top: 100px;
  width: 220px; height: 140px;
  background: linear-gradient(180deg, #1B3675, #0B1E3F);
  border-radius: 8px;
  border: 2px solid #fff;
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden;
  color: #fff;
}
.lr-cam-face {
  font-family: var(--font-kr-serif);
  font-weight: 500;
  font-size: 56px;
  letter-spacing: -0.04em;
  line-height: 1;
}
.lr-cam-label {
  position: absolute;
  bottom: 8px; left: 8px;
  background: rgba(0,0,0,0.55);
  padding: 3px 7px; border-radius: 3px;
  font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 5px;
}
.lr-cam-label::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%; background: #2ECC71;
  box-shadow: 0 0 6px #2ECC71;
}
.lr-cam-mic {
  position: absolute;
  top: 8px; right: 8px;
  background: var(--acad-red);
  border-radius: 4px;
  padding: 3px;
  display: inline-flex;
}

/* Bottom tool dock */
.lr-dock {
  background: #0F1722;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 12px 20px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  flex-shrink: 0;
}
.lr-tool {
  display: inline-flex; flex-direction: column; align-items: center;
  gap: 4px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  min-width: 72px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.lr-tool:hover { background: rgba(255,255,255,0.12); }
.lr-tool.active {
  background: var(--acad-red);
  border-color: var(--acad-red);
}
.lr-tool.off {
  background: rgba(0,29,61,0.18);
  border-color: rgba(0,29,61,0.45);
  color: #FFB3B5;
}
.lr-tool-sep { width: 1px; height: 32px; background: rgba(255,255,255,0.1); margin: 0 4px; }

/* Side panel (chat / qa / students) */
.lr-side {
  background: #0F1722;
  border-left: 1px solid rgba(255,255,255,0.08);
  display: flex; flex-direction: column;
  min-height: 0;
}
.lr-main[data-layout="stacked"] .lr-side {
  border-left: 0;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.lr-tabs {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.lr-tab {
  flex: 1;
  padding: 14px 0;
  background: transparent;
  color: rgba(255,255,255,0.55);
  font-weight: 700; font-size: 13px;
  border: 0;
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.lr-tab.active { color: #fff; border-bottom-color: var(--acad-red); }
.lr-tab:hover:not(.active) { color: rgba(255,255,255,0.85); }
.lr-tab-count {
  display: inline-block;
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.8);
  font-family: var(--font-en);
  font-weight: 700;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 9px;
  margin-left: 6px;
}
.lr-tab.active .lr-tab-count { background: var(--acad-red); color: #fff; }

.lr-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.lr-stacked-panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100%;
  min-height: 0;
}
.lr-stacked-panels > div {
  display: flex; flex-direction: column;
  min-height: 0;
  border-right: 1px solid rgba(255,255,255,0.08);
}
.lr-stacked-panels > div:last-child { border-right: 0; }

/* Chat */
.lr-chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
}
.lr-chat-msg {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 13.5px;
}
.lr-chat-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px;
  flex-shrink: 0;
}
.lr-chat-msg.instructor .lr-chat-avatar { background: var(--acad-red); }
.lr-chat-msg.me .lr-chat-avatar { background: var(--acad-yellow); color: var(--acad-ink); }
.lr-chat-body { min-width: 0; flex: 1; }
.lr-chat-name {
  display: flex; gap: 6px; align-items: baseline;
  font-size: 12px;
  margin-bottom: 2px;
}
.lr-chat-name strong { color: #fff; font-weight: 700; font-size: 12.5px; }
.lr-chat-msg.instructor .lr-chat-name strong { color: #FFB3B5; }
.lr-chat-name span { color: rgba(255,255,255,0.4); font-family: var(--font-en); font-size: 11px; }
.lr-chat-text {
  color: rgba(255,255,255,0.92);
  line-height: 1.4;
  word-wrap: break-word;
}
.lr-chat-input-bar {
  padding: 10px 12px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; gap: 8px;
  background: #0F1722;
  flex-shrink: 0;
}
.lr-chat-input {
  flex: 1;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff;
  font-size: 13px;
  border-radius: 6px;
  padding: 9px 12px;
  outline: none;
}
.lr-chat-input::placeholder { color: rgba(255,255,255,0.4); }
.lr-chat-input:focus { border-color: var(--acad-red); }
.lr-chat-send {
  background: var(--acad-red);
  color: #fff;
  border: 0;
  font-weight: 800; font-size: 12px;
  padding: 0 14px; border-radius: 6px;
  cursor: pointer;
}

/* Q&A */
.lr-qa-list {
  flex: 1; overflow-y: auto;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.lr-q {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 12px 14px;
  display: flex; gap: 12px;
}
.lr-q.answered {
  background: rgba(46, 204, 113, 0.06);
  border-color: rgba(46, 204, 113, 0.25);
}
.lr-q-vote {
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0;
  padding-top: 2px;
}
.lr-q-vote button {
  background: transparent;
  border: 0; color: rgba(255,255,255,0.5);
  cursor: pointer; padding: 2px; line-height: 1;
}
.lr-q-vote button:hover, .lr-q-vote.voted button { color: var(--acad-red); }
.lr-q-vote-num {
  font-family: var(--font-en); font-weight: 800;
  font-size: 14px;
  color: #fff;
  line-height: 1.2;
}
.lr-q-vote.voted .lr-q-vote-num { color: var(--acad-red); }
.lr-q-body { min-width: 0; flex: 1; }
.lr-q-meta {
  display: flex; gap: 8px; align-items: center;
  font-size: 11px;
  margin-bottom: 4px;
  color: rgba(255,255,255,0.5);
}
.lr-q-meta strong { color: #fff; font-weight: 700; font-size: 12px; }
.lr-q.answered .lr-q-meta::after {
  content: "답변 완료";
  background: rgba(46, 204, 113, 0.18);
  color: #6EE7A8;
  font-size: 10px; font-weight: 800;
  padding: 2px 6px; border-radius: 3px;
  letter-spacing: 0.04em;
  margin-left: auto;
}
.lr-q-text { font-size: 13.5px; color: rgba(255,255,255,0.92); line-height: 1.4; }
.lr-q-ask {
  padding: 10px 12px;
  border-top: 1px solid rgba(255,255,255,0.08);
  background: #0F1722;
  flex-shrink: 0;
}
.lr-q-ask button {
  width: 100%;
  background: rgba(255,214,10,0.15);
  border: 1px solid rgba(255,214,10,0.35);
  color: var(--acad-yellow);
  font-weight: 800; font-size: 13px;
  padding: 11px;
  border-radius: 6px;
  cursor: pointer;
}
.lr-q-ask button:hover { background: rgba(255,214,10,0.22); }

/* Students roster */
.lr-students {
  flex: 1; overflow-y: auto;
  padding: 12px 14px;
}
.lr-students-head {
  font-size: 11px; font-weight: 800;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.08em;
  padding: 8px 4px 6px;
}
.lr-student {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px;
  border-radius: 6px;
  font-size: 13px;
}
.lr-student:hover { background: rgba(255,255,255,0.04); }
.lr-student .av {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.1);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px;
  flex-shrink: 0;
  position: relative;
}
.lr-student.me .av { background: var(--acad-yellow); color: var(--acad-ink); }
.lr-student .av.cam-on::after {
  content: ""; position: absolute;
  inset: -2px;
  border: 2px solid #2ECC71;
  border-radius: 50%;
}
.lr-student .name { flex: 1; color: #fff; font-weight: 600; min-width: 0; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.lr-student .name small { color: rgba(255,255,255,0.5); font-weight: 500; margin-left: 4px; }
.lr-student .icons { display: inline-flex; gap: 6px; color: rgba(255,255,255,0.4); }
.lr-student .raised { color: var(--acad-yellow); }
.lr-student .raised svg { animation: wave 1s ease-in-out infinite; transform-origin: bottom center; }
/* On the dark live-classroom surfaces, deep-navy accents disappear — promote
   the accent to yellow so live status, active tools and sends stay legible. */
.lr-live-pill { background: var(--acad-yellow); color: var(--acad-ink); }
.lr-live-pill::before { background: var(--acad-ink); box-shadow: 0 0 0 0 rgba(0,29,61,0.55); }
.lr-leave:hover { background: rgba(255,214,10,0.9); border-color: var(--acad-yellow); color: var(--acad-ink); }
.lr-tool.active { background: var(--acad-yellow); border-color: var(--acad-yellow); color: var(--acad-ink); }
.lr-tab.active { border-bottom-color: var(--acad-yellow); }
.lr-tab.active .lr-tab-count { background: var(--acad-yellow); color: var(--acad-ink); }
.lr-chat-send { background: var(--acad-yellow); color: var(--acad-ink); }
.lr-chat-input:focus { border-color: var(--acad-yellow); }
.lr-chat-msg.instructor .lr-chat-avatar { background: var(--acad-yellow); color: var(--acad-ink); }
.lr-chat-msg.instructor .lr-chat-name strong { color: var(--acad-yellow); }
.lr-cam-mic { background: var(--acad-yellow); color: var(--acad-ink); }
.lr-q-vote button:hover, .lr-q-vote.voted button, .lr-q-vote.voted .lr-q-vote-num { color: var(--acad-yellow); }

@keyframes wave {
  0%, 100% { transform: rotate(-10deg); }
  50% { transform: rotate(15deg); }
}

/* ──────────────────────────────────────────────────────────────────
   ACADEMY MODE — global page overlays
   Re-skins shared components (.card .btn .input .chip .poster .tag etc)
   so every page (courses, detail, live, instructors, community, auth,
   mypage, checkout) inherits the academy look without rewrites.
   ────────────────────────────────────────────────────────────────── */
html[data-home-style="academy"] body {
  font-family: var(--font-kr);
}

/* Buttons */
html[data-home-style="academy"] .btn {
  border-radius: 6px;
  font-weight: 800;
}
html[data-home-style="academy"] .btn-primary { background: var(--acad-red); color: #fff; }
html[data-home-style="academy"] .btn-accent  { background: var(--acad-yellow); color: var(--acad-ink); }
html[data-home-style="academy"] .btn-ghost   { background: var(--acad-paper); color: var(--acad-ink); border: 1.5px solid var(--acad-line); }
html[data-home-style="academy"] .btn-soft    { background: var(--acad-bg-2); color: var(--acad-ink); }
html[data-home-style="academy"] .btn-link    { color: var(--acad-red); font-weight: 700; }
html[data-home-style="academy"] .btn-circle  { background: var(--acad-red); color: #fff; border-radius: 50%; }

/* Cards */
html[data-home-style="academy"] .card {
  background: var(--acad-paper);
  border: 1px solid var(--acad-line);
  border-radius: 10px;
}
html[data-home-style="academy"] .card-ink {
  background: var(--acad-navy);
  color: #fff;
  border-radius: 10px;
}
html[data-home-style="academy"] .card-soft {
  background: var(--acad-bg-2);
  border-radius: 10px;
}
html[data-home-style="academy"] .card-accent {
  background: var(--acad-yellow);
  color: var(--acad-ink);
  border-radius: 10px;
}

/* Inputs */
html[data-home-style="academy"] .input {
  border: 1.5px solid var(--acad-line);
  border-radius: 6px;
  background: var(--acad-paper);
  font-weight: 500;
}
html[data-home-style="academy"] .input:focus { box-shadow: inset 0 0 0 1.5px var(--acad-navy); border-color: var(--acad-navy); }
html[data-home-style="academy"] .field > label {
  font-family: var(--font-kr);
  letter-spacing: 0;
  text-transform: none;
  font-weight: 700;
  font-size: 13px;
  color: var(--acad-ink);
}

/* Chips & tags */
html[data-home-style="academy"] .chip {
  border-radius: 6px;
  font-weight: 700;
  border-color: var(--acad-line);
  height: 32px;
  padding: 0 12px;
  background: var(--acad-paper);
}
html[data-home-style="academy"] .chip-ink {
  background: var(--acad-navy);
  color: #fff;
  border-color: var(--acad-navy);
}
html[data-home-style="academy"] .chip-accent {
  background: var(--acad-red);
  color: #fff;
  border-color: var(--acad-red);
}
html[data-home-style="academy"] .tag {
  border-color: var(--acad-line);
  font-family: var(--font-kr);
  letter-spacing: 0;
  text-transform: none;
  font-weight: 800;
  font-size: 11px;
  color: var(--acad-navy);
  background: var(--acad-paper);
  border-radius: 4px;
}

/* Typography — eyebrows, section heads, headlines */
html[data-home-style="academy"] .eyebrow {
  font-family: var(--font-kr);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: none;
  color: var(--acad-red) !important;
  gap: 8px;
}
html[data-home-style="academy"] .eyebrow::before {
  background: var(--acad-red);
  width: 14px;
  opacity: 1;
}
html[data-home-style="academy"] .label-cap {
  font-family: var(--font-kr);
  text-transform: none;
  letter-spacing: 0;
  font-weight: 700;
  font-size: 12px;
  color: var(--acad-muted) !important;
}
html[data-home-style="academy"] .num-en {
  font-family: var(--font-en);
  font-weight: 800;
  letter-spacing: -0.025em;
}
html[data-home-style="academy"] .display,
html[data-home-style="academy"] .section-head h2 {
  font-family: var(--font-kr);
  font-weight: 900;
  letter-spacing: -0.04em;
}
html[data-home-style="academy"] .section-head .lead-en {
  font-family: var(--font-kr);
  font-style: normal;
  font-weight: 600;
  letter-spacing: 0;
  color: var(--acad-muted);
  font-size: 14px;
  text-transform: none;
}
/* Drop italic-en run-ins inside headings */
html[data-home-style="academy"] h1 span[style*="italic"],
html[data-home-style="academy"] h2 span[style*="italic"],
html[data-home-style="academy"] h3 span[style*="italic"] {
  font-family: var(--font-kr) !important;
  font-style: normal !important;
  font-weight: 800 !important;
  color: var(--acad-red);
}

/* All H1/H2/H3 in academy mode pick up Pretendard Black */
html[data-home-style="academy"] h1,
html[data-home-style="academy"] h2,
html[data-home-style="academy"] h3 {
  font-family: var(--font-kr) !important;
  font-weight: 900 !important;
  letter-spacing: -0.035em !important;
}

/* CoursePoster — re-skin to bold academy card */
html[data-home-style="academy"] .poster {
  border-radius: 10px;
  border-color: var(--acad-line);
  background: var(--acad-navy);
  color: #fff;
  padding: 20px;
}
html[data-home-style="academy"] .poster-cream { background: var(--acad-paper); color: var(--acad-ink); border: 1px solid var(--acad-line); }
html[data-home-style="academy"] .poster-ink   { background: var(--acad-navy); color: #fff; border: 0; }
html[data-home-style="academy"] .poster-accent{ background: var(--acad-red); color: #fff; border: 0; }
html[data-home-style="academy"] .poster-deep  { background: var(--acad-navy-2); color: #fff; border: 0; }
html[data-home-style="academy"] .poster-num {
  font-family: var(--font-en);
  font-weight: 900;
  font-size: 120px;
  letter-spacing: -0.05em;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// ── App context (router + cart + auth) ─────────────────────────────
const AppContext = createContext(null);
const useApp = () => useContext(AppContext);

function parseHash() {
  const h = (window.location.hash || "#/").replace(/^#/, "");
  const [path, query] = h.split("?");
  const params = new URLSearchParams(query || "");
  return { path: path || "/", params };
}

function AppProvider({ children, initialTweaks }) {
  const [route, setRoute] = useState(parseHash());
  const [cart, setCart] = useState([]); // [{courseId}]
  const [user, setUser] = useState(null);
  const [toast, setToast] = useState(null);
  const [tweaks, setTweaksState] = useState(initialTweaks);

  useEffect(() => {
    const onHash = () => {
      setRoute(parseHash());
      window.scrollTo({ top: 0, behavior: "instant" });
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const navigate = (to) => {
    if (typeof to === "string") {
      window.location.hash = "#" + to;
    }
  };

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => setToast(null), 2200);
  };

  const addToCart = (courseId) => {
    setCart((prev) => (prev.find((c) => c.courseId === courseId) ? prev : [...prev, { courseId }]));
    showToast("장바구니에 담았습니다");
  };
  const removeFromCart = (courseId) => setCart((p) => p.filter((c) => c.courseId !== courseId));
  const clearCart = () => setCart([]);

  const login = (email, name = "한도윤", initials = "도윤") => {
    setUser({ email, name, initials });
    showToast(`${name}님, 환영합니다`);
  };
  const logout = () => { setUser(null); showToast("로그아웃 되었습니다"); };

  const setTweak = (keyOrObj, value) => {
    const next = typeof keyOrObj === "string" ? { ...tweaks, [keyOrObj]: value } : { ...tweaks, ...keyOrObj };
    setTweaksState(next);
    try {
      window.parent.postMessage({ type: "__edit_mode_set_keys", edits: typeof keyOrObj === "string" ? { [keyOrObj]: value } : keyOrObj }, "*");
    } catch (e) {}
  };

  const value = { route, navigate, cart, addToCart, removeFromCart, clearCart, user, login, logout, showToast, tweaks, setTweak };

  return (
    <AppContext.Provider value={value}>
      {children}
      {toast && <div className="toast">{toast}</div>}
    </AppContext.Provider>
  );
}

// ── Course poster + card ───────────────────────────────────────────
const POSTER_VARIANTS = {
  ink: "poster poster-ink",
  cream: "poster poster-cream",
  accent: "poster poster-accent",
  deep: "poster poster-deep",
};
function CoursePoster({ course, size = "md", onClick }) {
  const ins = findInstructor(course.instructor);
  const subj = findSubject(course.subject);
  return (
    <button onClick={onClick} className={POSTER_VARIANTS[course.color]} style={{ width: "100%", textAlign: "left", cursor: "pointer" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div className="label-cap" style={{ opacity: 0.7 }}>No. {course.no} / {subj?.en}</div>
        {course.badge && <span className="tag" style={{ borderColor: "currentColor" }}>{course.badge}</span>}
      </div>
      <div className="poster-num">{course.no}</div>
      <div>
        <div className="poster-title">{course.title}</div>
        <div style={{ fontFamily: "var(--font-en)", fontStyle: "italic", fontWeight: 300, fontSize: 14, opacity: 0.7, marginTop: 4 }}>{course.subtitle}</div>
        <div style={{ marginTop: 18, display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12 }}>
          <span style={{ opacity: 0.8 }}>{ins?.name} · {course.level}</span>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 4, opacity: 0.8 }}>
            <Icon name="star" size={11} /> {course.rating}
          </span>
        </div>
      </div>
    </button>
  );
}

function CourseRowCard({ course, onOpen }) {
  const ins = findInstructor(course.instructor);
  const subj = findSubject(course.subject);
  return (
    <div className="card" style={{ padding: 22, display: "grid", gridTemplateColumns: "180px 1fr auto", gap: 28, alignItems: "center" }}>
      <div style={{ aspectRatio: "4 / 5" }}>
        <CoursePoster course={course} onClick={onOpen} />
      </div>
      <div>
        <div className="eyebrow" style={{ opacity: 0.7 }}>No. {course.no} — {subj?.en}</div>
        <h3 style={{ fontFamily: "var(--font-kr-serif)", fontWeight: 500, fontSize: 26, margin: "10px 0 6px", letterSpacing: "-0.025em" }}>{course.title}</h3>
        <p style={{ color: "var(--rj-muted)", fontSize: 14, margin: 0, maxWidth: 520 }}>{course.description}</p>
        <div style={{ display: "flex", gap: 16, marginTop: 14, fontSize: 13, color: "var(--rj-muted)", alignItems: "center" }}>
          <span><span className="avatar avatar-sm" style={{ marginRight: 6, verticalAlign: "middle" }}>{ins?.initials}</span> {ins?.name}</span>
          <span>·</span>
          <span>{course.lessons}강 · {course.hours}시간</span>
          <span>·</span>
          <span>{course.format}</span>
        </div>
      </div>
      <div style={{ textAlign: "right" }}>
        <div className="num-en" style={{ textDecoration: "line-through", color: "var(--rj-muted)", fontSize: 13 }}>{formatKRW(course.price)}</div>
        <div className="num-en" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-0.02em" }}>{formatKRW(course.salePrice)}</div>
        <button className="btn btn-primary btn-sm" style={{ marginTop: 10 }} onClick={onOpen}>자세히 보기 <Icon name="arrow" size={14} /></button>
      </div>
    </div>
  );
}

// ── Section helpers ────────────────────────────────────────────────
function SectionHead({ ko, en, action }) {
  return (
    <div className="section-head">
      <div>
        <div className="eyebrow" style={{ color: "var(--rj-muted)" }}>{en}</div>
        <h2 style={{ marginTop: 10 }}>{ko}</h2>
      </div>
      {action}
    </div>
  );
}
